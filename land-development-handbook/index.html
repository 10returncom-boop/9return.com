<style>
:root{
  --bg:#f6f3ec; --surface:#fffdf9; --surface2:#efe9dd; --ink:#211d18; --muted:#6f675c;
  --line:#e3dccf; --accent:#bc4b2c; --accent-soft:#f3e0d6; --accent-ink:#9a3a20;
  --ok:#3f7d5a; --warn:#b9791a; --risk:#b03a2e; --shadow:0 1px 2px rgba(40,30,20,.05),0 8px 24px rgba(40,30,20,.06);
  --sidebar-w:300px; --maxw:820px;
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#161412; --surface:#1f1c19; --surface2:#292521; --ink:#ece6da; --muted:#9d9488;
  --line:#332e28; --accent:#e07a4f; --accent-soft:#3a241c; --accent-ink:#f0a382;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.8;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== Header ===== */
header.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.5px}
.searchbox{flex:1;max-width:420px;margin-left:auto;position:relative}
.searchbox input{width:100%;padding:9px 14px 9px 38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;outline:none;transition:border-color .2s}
.searchbox input:focus{border-color:var(--accent)}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:18px;height:18px}

/* ===== Layout ===== */
.shell{max-width:1440px;margin:0 auto;display:flex;gap:0;align-items:flex-start}
aside.toc{width:var(--sidebar-w);flex:none;position:sticky;top:63px;height:calc(100vh - 63px);overflow-y:auto;padding:22px 14px 60px;border-right:1px solid var(--line)}
main.content{flex:1;min-width:0;padding:30px 40px 100px;max-width:calc(100vw - var(--sidebar-w))}

/* TOC */
.toc-label{font-size:11px;letter-spacing:2px;color:var(--muted);padding:0 12px 8px;text-transform:uppercase}
.toc-item{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13.5px;color:var(--muted);transition:.15s;line-height:1.4}
.toc-item:hover{background:var(--surface2);color:var(--ink)}
.toc-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc-part{margin-top:14px;font-family:var(--serif);font-weight:700;font-size:13px;padding:6px 12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.toc-part .num{color:var(--accent);font-size:11px;font-family:var(--sans);font-weight:700}
.toc-sub{padding:2px 0 2px 26px}
.toc-sub .toc-item{font-size:12.5px;padding:5px 10px}

/* ===== Article ===== */
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb b{color:var(--ink);font-weight:500}
.crumb .sep{opacity:.5}
article{max-width:var(--mxw);margin:0 auto}
article.prose{max-width:var(--maxw)}
.part-hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 36px;box-shadow:var(--shadow);margin-bottom:30px}
.part-hero .kicker{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:2px}
.part-hero h1{font-family:var(--serif);font-size:30px;line-height:1.3;margin:8px 0 10px;font-weight:900}
.part-hero p{color:var(--muted);font-size:14.5px}
h2.chap{font-family:var(--serif);font-size:23px;font-weight:700;margin:38px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line);scroll-margin-top:80px}
h2.chap .cn{color:var(--accent);font-size:14px;font-family:var(--sans);font-weight:700;display:block;letter-spacing:1px;margin-bottom:2px}
h3.sec{font-family:var(--serif);font-size:17px;font-weight:700;margin:24px 0 8px;color:var(--ink)}
.prose p{margin:12px 0;color:var(--ink)}
.prose ul,.prose ol{margin:10px 0 10px 4px;padding-left:22px}
.prose li{margin:6px 0}
.prose strong{color:var(--accent-ink);font-weight:700}
.prose blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 18px;border-radius:0 10px 10px 0;margin:16px 0;color:var(--ink);font-size:14.5px}

/* cards / stat */
.grid{display:grid;gap:14px;margin:18px 0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.card .stat{font-family:var(--serif);font-size:26px;font-weight:900;color:var(--accent);line-height:1.1}
.card .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
.card h4{font-size:14.5px;margin-bottom:6px;font-family:var(--serif)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px;table-layout:fixed}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);word-wrap:break-word}
th{background:var(--surface2);font-weight:700;font-size:12.5px;white-space:normal}
tr:last-child td{border-bottom:none}
td .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
.tag.high{background:#f6ddd6;color:#a33327}
.tag.mid{background:#f6e7c9;color:#8a5a12}
.tag.low{background:#d8e8dd;color:#2f6b45}

/* timeline */
.timeline{position:relative;margin:24px 0;padding-left:8px}
.tl-item{display:grid;grid-template-columns:120px 26px 1fr;gap:0;align-items:start;padding-bottom:22px}
.tl-time{font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px;font-weight:600}
.tl-axis{position:relative;display:flex;justify-content:center}
.tl-dot{width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent);z-index:1;margin-top:3px}
.tl-line{position:absolute;top:16px;bottom:-8px;width:2px;background:var(--line)}
.tl-item:last-child .tl-line{display:none}
.tl-body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow)}
.tl-body h4{font-size:14.5px;font-family:var(--serif);margin-bottom:3px}
.tl-body p{font-size:13px;color:var(--muted);margin:0}

/* FAQ */
.faq{margin:20px 0;display:grid;gap:10px}
.faq .faq-title{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:4px}
details.faq-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;box-shadow:var(--shadow)}
details.faq-item summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;cursor:pointer;font-weight:600;font-size:14.5px;font-family:var(--serif);list-style:none}
details.faq-item summary::-webkit-details-marker{display:none}
details.faq-item summary .q{flex:1}
details.faq-item summary .ico{color:var(--accent);font-size:18px;transition:transform .2s;flex:none}
details.faq-item[open] summary .ico{transform:rotate(45deg)}
details.faq-item p{padding:2px 18px 15px;margin:0;font-size:14px;color:var(--muted);line-height:1.8;border-top:1px dashed var(--line);padding-top:12px}

/* home hero */
.hero{background:linear-gradient(135deg,var(--surface) 60%,var(--accent-soft));border:1px solid var(--line);border-radius:20px;padding:48px 44px;box-shadow:var(--shadow);margin-bottom:34px}
.hero .kicker{color:var(--accent);font-weight:700;letter-spacing:3px;font-size:13px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,4vw,44px);font-weight:900;line-height:1.25;margin:12px 0 14px}
.hero p{color:var(--muted);max-width:640px;font-size:15px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-size:12.5px;color:var(--muted)}

.part-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:18px 0}
.part-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s}
.part-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.part-card .pnum{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--accent);opacity:.35;line-height:1}
.part-card h4{font-family:var(--serif);font-size:15.5px;margin:8px 0 6px}
.part-card p{font-size:12.5px;color:var(--muted);line-height:1.5}

/* prev/next nav */
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:50px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;transition:.15s}
.pager a:hover{border-color:var(--accent)}
.pager .dir{font-size:11px;color:var(--muted);letter-spacing:1px}
.pager .ttl{font-family:var(--serif);font-weight:700;font-size:14.5px;margin-top:3px}
.pager a.next{text-align:right}

/* search results */
.search-hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0;cursor:pointer}
.search-hit:hover{border-color:var(--accent)}
.search-hit .h{font-weight:700;font-family:var(--serif);font-size:14.5px}
.search-hit .m{font-size:12.5px;color:var(--muted);margin-top:3px}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}

footer{border-top:1px solid var(--line);padding:26px 40px;color:var(--muted);font-size:12.5px;text-align:center;max-width:1440px;margin:0 auto}

/* mobile */
.menu-toggle{display:none}
.scrim{display:none}
@media(max-width:900px){
  aside.toc{position:fixed;left:0;top:63px;bottom:0;z-index:40;background:var(--surface);transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}

/* ============ 書籍資料 ============ */
const BOOK = {
  title:"建築業土地開發全流程百科全書",
  sub:"營建產業標準工具書・土地開發全階段權威指南",
  audience:"建設公司、營造廠、建築師、技師、地政人員、開發投資人、產業研究人員、相關科系師生",
  parts:[
  {id:"p1",num:"第一篇",title:"基礎總論",desc:"土地開發核心概念、產業體系與法規架構",chapters:[
    {id:"c1",title:"土地開發定義、屬性與產業架構",blocks:[
      {t:"p",html:"建築業土地開發，係指開發主體透過土地取得、用地屬性調整、法規審查、規劃設計、工程興建、產權登記等一連串合法程序，將原始素地（農地、空地、舊建地、都市計畫用地等）轉換為可合法銷售、使用、持有之建築物與土地不動產的商業與工程行為。簡言之，<strong>土地開發就是把「一塊地」透過合法程序，變成「一棟可住、可賣、可貸款、可傳承的建築物與土地組合」</strong>。"},
      {t:"quote",html:"不同於單純工程營造，土地開發是<strong>「法規審查為先、土地權屬為根、工程建設為體、銷售產權為果」</strong>的跨領域整合產業，橫跨地政、都市計畫、環保、水土保持、消防、建管、稅務、金融等數十個領域。真正的開發價值，不在施工本身，而在於對法規、市場與資金的整合判斷能力。"},
      {t:"h3",html:"土地開發的核心屬性與產業定位"},
      {t:"p",html:"土地開發具有「長週期、高資金、多關卡、強監管」四大產業屬性。長週期指一案從尋地到交屋動輒兩年以上；高資金指土地與工程成本往往動輒數億新台幣；多關卡指過程中要通過用地變更、建照、勘驗、使照、登記等多道行政審查；強監管指所有環節都受都市計畫、建築、水土保持、環境保護等法規高度管制。這四項屬性決定了從業者必須同時具備地政、財務、法務與工程專業，任何單一專業都無法獨立完成一件開發案。"},
      {t:"h3",html:"兩大核心開發類別"},
      {t:"cards",items:[
        {h:"都市土地開發",p:"位於都市計畫區內，多數已為建地，無需大幅變更編定，審查單純、時程短。標準總時程 2～3.5 年，風險等級：中。適合資金周轉快的開發商。"},
        {h:"非都市土地開發",p:"農地、林業用地等須先完成使用編定變更、環評、水保、回饋。標準總時程 4～7 年，大型案可逾 8 年，風險等級：高。土地成本較低但審查高度不確定。"},
        {h:"都市更新與危老重建",p:"針對老舊建物以容積獎勵誘因重建。整合期 2～5 年，前期最耗時；一旦整合完成，因容積獎勵與稅捐減免，獲利潛力相對突出。"}
      ]},
      {t:"h3",html:"開發產業核心參與主體與權責分工"},
      {t:"p",html:"一件開發案的成功，取決於以下專業主體能否在各自分工上精準到位。起造人（建設公司或地主）是整案投資與決策中樞；建築師負責規劃設計與送審簽證；專業技師（結構、水土保持、消防、污水）負責各系統計算與簽證；營造廠負責把圖說變成實體建築；地政士（代書）負責產權移轉與登記；銷售顧問負責預售與去化；金融機構則提供土地與工程融資。下表彙整各角色核心職責與成本占比："},
      {t:"table",head:["角色","核心職責","成本占比"],widths:["26%","50%","24%"],rows:[
        ["起造人（建設公司/地主）","投資、決策、資金調度、整案管理","資金成本另計"],
        ["建築師","規劃、設計、送審、勘驗簽證、使照","設計監造費 2.0～3.5%"],
        ["專業技師","結構/水保/消防/污水系統計算簽證","技師費合計 1.0～2.5%"],
        ["營造廠","工程施工、工地安衛、品質管控","建安成本 40～55%"],
        ["地政士（代書）","移轉、測量、產權登記","約 0.3～0.8%"],
        ["銷售顧問/廣告","預售規劃、行銷、銷售管理","管銷廣告 4～8%"],
        ["金融機構","土地/工程融資、價金信託","利息約 6～12%"]
      ]},
      {t:"h3",html:"土地開發的價值創造邏輯"},
      {t:"p",html:"開發商的獲利來源，本質上來自「土地價格與開發後價值的價差」加上「容積率所決定的可銷售面積」。同樣一塊地，能否透過合法途徑提高容積率、降低建蔽率、優化戶型坪效，直接決定了整案毛利率。因此，土地開發從業者最核心的能力，是<strong>在符合法規的前提下，把每一坪土地轉化出最大的合法銷售價值</strong>。這也是為何容積率、建蔽率、土地使用分區會被稱為「土地開發的三大命脈」。"},
      {t:"faq",items:[
        {q:"什麼是土地開發？",a:"土地開發是指開發主體透過土地取得、用地變更、法規審查、規劃設計、工程興建與產權登記等一連串合法程序，將原始素地轉換為可合法銷售與使用之建築物及土地不動產的整合性商業行為。"},
        {q:"土地開發與一般工程營造有何不同？",a:"工程營造僅是開發流程中「把圖說變成實體」的單一環節；土地開發則是涵蓋地政、都市計畫、環保、水保、消防、稅務、金融等多領域的整合產業，法規審查與土地權屬整合往往比施工本身更具挑戰。"},
        {q:"都市土地與非都市土地開發差在哪裡？",a:"都市土地多已編為建地，審查單純、時程約2～3.5年；非都市土地（如農地）需先完成使用編定變更、環評、水保與回饋，時程4～7年甚至更久，不確定性與風險明顯較高。"},
        {q:"土地開發最核心的三大指標是什麼？",a:"土地使用分區、容積率與建蔽率。這三者共同決定了基地能興建的最大合法樓地板面積，是評估開發獲利潛力的第一手數據。"}
      ]}
    ]},
    {id:"c2",title:"土地開發核心法規與管制體系",blocks:[
      {t:"p",html:"所有開發流程皆以法規為最高準則。土地開發的最大特性之一，就是<strong>「程序重於實質」</strong>——即使工程品質再好，只要程序不合法、圖說不符、送審疏漏，都可能導致停審、撤件、罰鍰，甚至無法取得使照而無法交屋。因此，認識並掌握與土地開發相關的整套法規體系，是進入這個產業的第一堂必修課。"},
      {t:"h3",html:"土地開發法規體系總覽（五大層級）"},
      {t:"p",html:"台灣的土地開發法規大致可依規範對象分為五大面向：第一是<strong>土地使用與分區管制</strong>，由都市計畫法、區域計畫法、非都市土地使用管制規則主導，決定「這塊地能蓋什麼」；第二是<strong>建築管理</strong>，由建築法、建築技術規則主導，決定「蓋出來要符合哪些結構、消防、避難標準」；第三是<strong>環境與水土保持</strong>，由環境影響評估法、水土保持法主導，決定「開發對環境的影響是否通過審查」；第四是<strong>地政與產權</strong>，由土地法、地政士法、土地登記規則主導，確保「土地權屬乾淨可登記」；第五是<strong>交易與稅務</strong>，由消費者保護法、預售屋買賣定型化契約、房地合一稅等規範主導，影響銷售與利潤。五大面向環環相扣，缺一不可。"},
      {t:"h3",html:"九大核心法規與其管制重點"},
      {t:"ul",items:[
        "<strong>建築法、建築技術規則</strong>（建築、結構、設備編）：退縮、樓高、防火避難、停車空間",
        "<strong>都市計畫法、容積移轉實施辦法</strong>：容積獎勵、容積調派、都計變更",
        "<strong>非都市土地使用管制規則</strong>：農地變更、各類用地使用限制",
        "<strong>環境影響評估法</strong>：開發面積達門檻（約 10 公頃）須提環評書件",
        "<strong>水土保持法</strong>：坡度 ≥5% 即需水保審查；坡度 ≥30% 禁止開發",
        "<strong>消防法</strong>、各類場所消防安全設備設置標準",
        "<strong>地政士法、土地登記規則、建物測量辦法</strong>",
        "<strong>預售屋買賣定型化契約應記載及不得記載事項</strong>",
        "<strong>營造業法、職業安全衛生法</strong>"
      ]},
      {t:"h3",html:"環境影響評估與水土保持的關鍵門檻"},
      {t:"p",html:"在實務上，最容易讓開發案延宕甚至胎死腹中的，往往不是建築審查，而是環境與水保關卡。<strong>環評門檻：開發面積達一定規模（一般約 10 公頃）即須提送環境影響評估書件</strong>，須經環評委員會審查通過後才能進行開發。水保方面，<strong>基地坡度達 5% 以上即須擬定水土保持計畫送審，坡度達 30% 以上原則禁止開發</strong>。這兩個門檻在尋地階段就必須先行查核，否則等到投入鉅額規劃費用後才發現無法過關，損失極大。"},
      {t:"h3",html:"法規管制的核心邏輯：程序正義與民眾參與"},
      {t:"p",html:"土地開發審查另一個容易被忽略的重點，是<strong>公開展覽與民眾意見</strong>機制。非都市土地變更、都市計畫變更等重大開發，依法須辦理公開展覽、說明會，聽取民眾意見。這意味著開發案除了要過行政關卡，還要面對地方居民與利害關係人的溝通。開發商若能及早進行地方溝通、說明開發效益與回饋內容，往往能大幅降低審查階段的阻力。"},
      {t:"faq",items:[
        {q:"土地開發需要遵守哪些主要法規？",a:"主要包括都市計畫法、區域計畫法、非都市土地使用管制規則（土地使用）；建築法、建築技術規則（建築管理）；環境影響評估法、水土保持法（環境）；土地法、土地登記規則、地政士法（產權）；以及消保法與預售屋定型化契約（交易）。"},
        {q:"開發面積多大需要環境影響評估？",a:"開發面積達一定門檻（一般約10公頃）即須提送環境影響評估書件，經環評委員會審查通過後才能開發；實際門檻以各目的事業主管機關公告為準。"},
        {q:"基地坡度對開發有何限制？",a:"坡度達5%以上即須擬定水土保持計畫送審；坡度達30%以上原則禁止開發。因此在尋地階段即應先查核坡度，避免投入過度資源後才發現不可行。"},
        {q:"違反土地開發法規會有何後果？",a:"輕則停審、撤件、罰鍰、勒令停工；重則拆除違法建築、無法取得使用執照，導致無法交屋與登記，甚至涉及刑事責任。務必全程依規辦理。"}
      ]}
    ]}
  ]},
  {id:"p2",num:"第二篇",title:"前置作業",desc:"土地篩選、盡職調查與可行性評估",chapters:[
    {id:"c3",title:"土地篩選與基地基本條件判定",blocks:[
      {t:"p",html:"開發第一步並非買地，而是「篩地」——透過公務系統查核基地先天限制，提前排除不可開發、高風險、低獲利標的，節省大量時間與成本。<strong>基地初步篩選工期約 7～14 天/案</strong>。這個階段的投資報酬率是所有流程中最高的：花一兩週的時間，就能避免投入數百萬規劃費後才發現土地根本無法開發的窘境。"},
      {t:"h3",html:"為什麼要先篩地而不是先買地？"},
      {t:"p",html:"土地開發最昂貴的錯誤，就是「買到不能蓋的地」。一塊土地能否開發，取決於都市計畫分區、容積率、建蔽率、臨路條件、管制區、公共設施六大先天條件。這些條件多半在買賣前就已成定局，幾乎無法靠後續努力改變。因此，專業開發商一定會在出價之前，先完成一份嚴謹的基地條件篩選報告，確認土地「值得開發、可以開發、有利可圖」三件事同時成立，才會進入議價階段。"},
      {t:"h3",html:"基礎資料查核項目（六大關鍵）"},
      {t:"ul",items:[
        "都市計畫分區別：住宅區、商業區、工業區、保護區、農業區，直接決定開發用途",
        "法定容積率、建蔽率：決定最大可建樓地板面積，是獲利核心指標",
        "基地臨路條件：住宅區最小臨路寬度約 4m，大樓通常要求 6m 以上，通路權須完整",
        "管制區查核：淹水區、山坡地、禁建區、限建區、文化資產保存區、生態敏感區",
        "公共設施鄰近性：雨水、污水、自來水、電力、電信管線是否可銜接",
        "地形地質條件：坡度、土壤、地層是否適合開發，是否需額外擋土與基礎費用"
      ]},
      {t:"h3",html:"如何查核這些基地條件？"},
      {t:"p",html:"實務上，專業開發商會透過多個公務管道交叉查核：向都市發展局或區公所申請<strong>土地使用分區證明</strong>，確認分區與容積；向地政事務所調閱<strong>土地登記謄本與地籍圖</strong>，確認權屬與地形；向水利、工務單位查詢<strong>淹水潛勢與管線分布</strong>；必要時委託測量公司辦理<strong>地形測量與界址鑑定</strong>。這些查核多半可在一至兩週內完成，成本相對低廉，卻是整案成敗的分水嶺。"},
      {t:"h3",html:"絕對禁止與高風險基地"},
      {t:"quote",html:"❌ 法定禁建區、地質脆弱坍塌區、嚴重淹水區、文化資產核心保護區 → 直接排除。<br>⚠️ 無通路私地、權屬紛爭未決、共有持分複雜 → 高風險，權屬整合完成前不建議投入。"},
      {t:"p",html:"需要特別提醒的是，<strong>「便宜」往往代表「有問題」</strong>。市場上低於行情的土地，常見原因包括：位於淹水或山坡管制區、產權有糾紛、臨路條件不足、甚至涉及占用或違法使用。開發商若因貪圖低價而忽略篩選程序，往往在後續投入大量時間金錢後，才發現土地價值遠低於預期。正確心態是：篩地階段寧可謹慎，也不可心存僥倖。"},
      {t:"faq",items:[
        {q:"土地開發第一步應該做什麼？",a:"不是買地，而是「篩地」。透過公務系統查核基地的都市計畫分區、容積率、建蔽率、臨路、管制區與公共設施等先天條件，先排除不可開發與高風險標的。"},
        {q:"什麼是土地使用分區證明？",a:"由主管機關核發、載明土地所屬都市計畫使用分區（住宅區、商業區、工業區等）及相關管制規定的書面文件，是判斷土地能否開發、可做何種用途的首要依據。"},
        {q:"基地臨路寬度不足會怎樣？",a:"住宅區通常要求最小臨路寬度約4公尺，大樓案常需6公尺以上。臨路不足可能導致無法興建、需退縮或無法取得通路，嚴重影響開發價值。"},
        {q:"為何便宜的土地反而要小心？",a:"低於行情的土地常伴隨淹水管制、山坡地、產權糾紛、臨路不足或違法使用等問題。篩地階段的謹慎，是避免後續巨大損失的最有效投資。"}
      ]}
    ]},
    {id:"c4",title:"土地盡職調查（DD）完整作業",blocks:[
      {t:"p",html:"盡職調查（Due Diligence，簡稱 DD）是土地投資的防火牆，目的在全面確認土地權屬完整、無隱藏風險。<strong>標準 DD 工期 21～45 天</strong>，複雜共有/抵押案可達 60 天；成本約 15～40 萬元。這筆費用看似不低，但相較於買到產權瑕疵土地後可能付出的法律訴訟與整合成本，可說是CP值最高的風險控管投資。"},
      {t:"h3",html:"什麼是土地盡職調查？為什麼不可或缺？"},
      {t:"p",html:"土地盡職調查，是指開發商在投入資金前，針對目標土地的<strong>權屬狀態、實際現況、法規限制</strong>三大面向進行全面而系統性的查證。它的核心價值在於：把「看不見的風險」在交易前找出來。一塊土地即使登記謄本乾淨，也可能存在現地占用、租賃未消滅、越界建築、鄰地爭議、甚至最高限額抵押等隱藏問題。若未在 DD 階段發現，後續輕則開發受阻，重則血本無歸。因此，正規開發商寧可多花時間金錢把 DD 做扎實，也絕不輕率跳過。"},
      {t:"h3",html:"4.1 權屬調查"},
      {t:"ul",items:[
        "調閱土地登記謄本、地籍圖、建物登記資料",
        "確認所有權人、持分比例、共有土地型態",
        "查核抵押權、質權、查封、假扣押、預告登記",
        "確認地上權、租賃權、現地佔用、鄰地越界爭議",
        "查核土地有無被徵收、區段徵收或重劃在案"
      ]},
      {t:"h3",html:"4.2 實地現勘調查"},
      {t:"ul",items:["現地界址釐清、圍界確認、佔用拍照存證","地質、地形、坡度、排水狀況勘查","鄰房、臨路、周遭環境、噪音、污染源調查","有無未登記建物、違章、墳墓或其他地上物"]},
      {t:"h3",html:"4.3 法規與公務查核"},
      {t:"p",html:"向主管機關申請土地使用分區證明、無禁建證明、公共設施證明，取得書面文件，並確認土地是否位於淹水潛勢區、山坡地管制區或其他特殊限制範圍。這份查核結果將與權屬調查、現勘資料三方交叉比對，找出所有可能影響開發的風險點。<strong>常見卡關：謄本與現地佔用不一致、租賃未消滅、土地有最高額抵押。</strong>"},
      {t:"h3",html:"DD 完成後的風險分級與決策"},
      {t:"p",html:"完整 DD 完成後，專業開發商會將風險分為三級：<strong>綠燈（可開發）</strong>——權屬完整、法規可行、無重大風險，可進入議價與財務評估；<strong>黃燈（可開發但需處理）</strong>——存在占用、租賃、抵押等可解決問題，須於合約中設定處理條件與時程；<strong>紅燈（不建議開發）</strong>——存在無法解決的權屬或法規障礙。把風險在交易前分級、並據此設定合約條件，是土地投資能否控制損失的關鍵。"},
      {t:"faq",items:[
        {q:"土地盡職調查（DD）是什麼？",a:"DD 是開發商在投入資金前，針對土地權屬狀態、實際現況與法規限制三大面向進行的全面查證，目的在交易前找出隱藏風險，標準工期約21～45天、成本約15～40萬元。"},
        {q:"土地盡職調查包含哪些項目？",a:"主要包含三部分：權屬調查（謄本、抵押、查封、地上權、占用）、實地現勘（界址、地形、鄰房、污染）、法規查核（分區、禁建、水保、淹水潛勢）。"},
        {q:"DD 最常卡關的問題有哪些？",a:"最常見的是登記謄本與現地占用不一致、租賃關係未消滅、土地設有最高限額抵押、以及共有土地持分整合困難。"},
        {q:"DD 做完後如何決定是否開發？",a:"依風險分三級：綠燈（權屬完整可開發）、黃燈（可處理的問題，於合約設定條件）、紅燈（無法解決的權屬或法規障礙，建議放棄）。"}
      ]}
    ]},
    {id:"c5",title:"財務與開發可行性評估",blocks:[
      {t:"p",html:"確認土地無風險後進行完整財務試算，可行性報告工期約 10～21 天。財務評估是土地開發從「感性看好」走向「理性決策」的關鍵轉折點：<strong>再好的地段，若財務數字不過關，就不該開發；而透過嚴謹的試算，也能幫助開發商在出價與規劃上做出最有利的決策</strong>。"},
      {t:"h3",html:"為什麼財務評估是開發成敗的樞紐？"},
      {t:"p",html:"土地開發動輒投入數億元資金、歷時數年，若在初期就計算出無利可圖，及早收手反而是最理性的選擇。財務評估的價值，在於把「土地面積 × 容積率 → 可銷售坪數 → 總銷金額 → 總開發成本 → 利潤」這條價值鏈在紙上完整推算一遍，並對市場行情、成本波動、銷售速度做敏感性測試。透過這套試算，開發商能回答三個關鍵問題：<strong>這塊地能蓋多大？能賣多少錢？扣掉成本後能賺多少？</strong>"},
      {t:"h3",html:"核心試算指標與公式"},
      {t:"table",head:["指標","計算方式"],widths:["38%","62%"],rows:[
        ["最大樓地板面積","土地面積 × 容積率"],
        ["建蔽面積上限","土地面積 × 建蔽率"],
        ["可銷售坪數","總樓地板面積 − 停車、梯廳、機電等公設"],
        ["毛利率","（總銷金額 − 總開發成本）/ 總銷金額"],
        ["IRR 內部報酬率","住宅門檻 ≥12%；商業開發 ≥15%"]
      ]},
      {t:"h3",html:"從「坪效」到「總銷」的推演邏輯"},
      {t:"p",html:"財務試算的第一步，是推估可銷售坪數。以一塊 500 坪、容積率 300% 的都市土地為例，最大樓地板面積約 1500 坪；扣除停車空間、梯廳、機電、陽台等公設比例後，可銷售坪數約在 1000～1200 坪之間。接著乘上市場行情單價，即可得到總銷金額。這個推演看似簡單，卻是一切決策的基礎——因為<strong>容積率每多 10%，可銷售坪數與總銷金額就可能增加數百萬元</strong>，這正是為何開發商會積極尋求容積獎勵、容積移轉等合法擴充手段。"},
      {t:"h3",html:"成本面：土地、工程與隱形成本三層結構"},
      {t:"p",html:"總開發成本通常可分為三層：<strong>土地成本</strong>（含土地價金、仲介、代書、稅費）、<strong>工程成本</strong>（含建安工程、設計監造、技師費）、以及<strong>隱形成本</strong>（含利息、管銷廣告、回饋金、稅金、雜項）。其中最容易讓新手失算的，是利息與管銷成本——開發週期越長、利率越高、銷售越慢，這兩項成本就會像滾雪球般放大。因此專業試算必定包含「時間維度」，把每一期的資金投入與回收逐期攤算。"},
      {t:"h3",html:"開發決策機制"},
      {t:"cards",items:[
        {h:"✅ 准予開發",p:"IRR 達標、權屬無重大瑕疵、法規限制可控"},
        {h:"⚠️ 調整規模",p:"IRR 接近門檻但風險偏高，調整量體或重談地價"},
        {h:"❌ 終止投資",p:"IRR 不足或基地有重大管制限制"}
      ]},
      {t:"h3",html:"敏感性分析與壓力測試"},
      {t:"p",html:"一套成熟的財務評估，不能只看單一數字，而要做<strong>敏感性分析</strong>：假設售價下跌 10%、工期延長一年、利率上升 1%，IRR 會降至多少？透過這些壓力測試，開發商能掌握整案的風險緩衝空間。一般實務標準是：<strong>即便在最壞情境下，仍應維持正現金流與可接受的最低報酬</strong>，否則就應重新議價或調整規模，而不是硬著頭皮開發。"},
      {t:"faq",items:[
        {q:"土地開發可行性評估要做多久？",a:"一般可行性報告工期約10～21天，涵蓋可銷售坪數推估、總銷試算、成本結構分析、敏感性測試與IRR計算等完整財務試算。"},
        {q:"IRR 內部報酬率要多高才算可以開發？",a:"實務上住宅開發門檻約為12%、商業開發約15%。若IRR未達門檻，應調整量體、重談地價或考慮終止投資。"},
        {q:"最大樓地板面積怎麼算？",a:"最大樓地板面積＝土地面積 × 容積率；可銷售坪數則另需扣除停車、梯廳、機電等公共設施面積。"},
        {q:"開發成本包含哪些項目？",a:"主要分三層：土地成本（地價、稅費）、工程成本（建安、設計監造、技師費）、隱形成本（利息、管銷廣告、回饋金、稅金），其中利息與管銷常被新手低估。"}
      ]}
    ]}
  ]},
  {id:"p3",num:"第三篇",title:"土地取得與用地變更",desc:"最耗時、最關鍵的核心階段",chapters:[
    {id:"c6",title:"土地取得模式與實務作業",blocks:[
      {t:"p",html:"土地是土地開發最重要的生產要素，如何取得土地、以何種模式取得，直接決定了整案的資金壓力、產權結構與獲利分配。產業主流土地取得模式共五種，各有優劣與適用場景，開發商必須依自身資金、風險承受度與開發目標選擇最合適的模式。"},
      {t:"table",head:["模式","工期","優點","缺點"],widths:["20%","20%","30%","30%"],rows:[
        ["買賣移轉","30～60 天","產權乾淨、主控權高","土地資金壓力大"],
        ["合建分屋/分潤","談判 45～90 天","土地現金投入低","地主協調風險、產權複雜"],
        ["都市更新","整合 2～5 年","容積獎勵、稅減免","住戶整合難、少數戶可卡案"],
        ["政府公開標售","60～120 天","權屬完整、資訊透明","競標激烈、地價高"],
        ["土地徵收","公部門主導","—","程序冗長，民間極少使用"]
      ]},
      {t:"h3",html:"五種取得模式的適用情境分析"},
      {t:"p",html:"<strong>買賣移轉</strong>是最直接的模式，開發商以自有資金或融資向地主購入土地，取得完整產權，主控權最高，但資金壓力也最大，適合資金充足、追求完全掌控權的開發商。<strong>合建分屋/分潤</strong>則以「地主出地、建商出資」的方式合作，大幅降低土地現金需求，但需要處理地主的協調與信任問題，適合資金有限但具開發能力的建商。<strong>都市更新</strong>透過容積獎勵與稅捐減免獲利，但前期住戶整合曠日費時。<strong>政府公開標售</strong>產權最乾淨、資訊最透明，但競爭激烈。至於<strong>土地徵收</strong>多由公部門主導，民間極少使用。"},
      {t:"h3",html:"合建模式的四大關鍵作業與風險"},
      {t:"p",html:"合建是台灣住宅開發最常見的模式，但也隱藏最多溝通風險。實務上，合建案的成敗往往取決於四大關鍵作業：<strong>權益分配比例的談判</strong>（雙方如何分屋、分潤）、<strong>產權整合與信託</strong>（土地信託以保障雙方權益）、<strong>契約條款設計</strong>（含點交時程、違約責任、變更機制）、以及<strong>地主意見整合</strong>。其中地主內部的意見分歧，往往是最難處理的環節——家族成員對分配比例、戶型、出售時機各有想法，一旦溝通破裂，整案就可能停擺。"},
      {t:"quote",html:"合建最常見風險：地主延遲點交土地、對規劃方案反悔、持分內部意見分歧。建議透過土地信託、分階段付款與明確的契約違約條款，將風險降到最低。"},
      {t:"h3",html:"土地取得的稅費與成本考量"},
      {t:"p",html:"取得土地不是只有「付地價」這麼簡單。買賣移轉時，買方須負擔土地增值稅（依法可約定由賣方或買方負擔，實務多由賣方負擔）、契稅、登記規費、印花稅、代書費與仲介費等。合建與都更案則另有土地信託、履約保證等費用。這些稅費與雜支看似比例不高，但在數億元的地價規模下，累積金額十分可觀，必須在財務試算中精確估算，避免侵蝕利潤。"},
      {t:"faq",items:[
        {q:"土地取得主要有哪幾種模式？",a:"主要有五種：買賣移轉、合建分屋/分潤、都市更新、政府公開標售與土地徵收。各有優缺點，應依資金與開發目標選擇。"},
        {q:"合建與買賣土地有何差別？",a:"買賣取得完整產權、主控權高但資金壓力大；合建由地主出地、建商出資，土地現金需求低，但須處理地主協調與產權複雜度。"},
        {q:"合建案最常見的風險是什麼？",a:"地主延遲點交土地、對規劃方案反悔、持分內部意見分歧。建議透過土地信託、分階段付款與明確違約條款降低風險。"},
        {q:"土地買賣移轉要負擔哪些稅費？",a:"包括土地增值稅、契稅、登記規費、印花稅、代書費與仲介費等，須於財務試算中精確估算。"}
      ]}
    ]},
    {id:"c7",title:"非都市土地用地變更全流程",blocks:[
      {t:"p",html:"都市建地無須變更編定；非都市農地轉建地為開發最大難點。<strong>單純案 1.5～2.5 年，大型/敏感區 3～5 年</strong>，是全流程最耗時、不確定性最高的階段。若非都市土地是您手上最主要的開發素材，務必對這條冗長而嚴謹的程序有完整認知，並保留足夠的工期與資金緩衝。"},
      {t:"h3",html:"為什麼非都市土地變更這麼耗時？"},
      {t:"p",html:"非都市土地變更之所以耗時，是因為它牽涉<strong>中央與地方多層級、多單位的審查</strong>。以農地變更為例，除了地方政府要審查開發構想是否符合區域計畫與土地使用管制規則，還可能涉及環境影響評估、水土保持計畫、生態檢核、文化資產勘查、交通衝擊評估等專業審查，最後還需依規定繳納開發回饋金或捐贈公共設施用地。每一個環節都可能補正、退件、再審，因此整體時程動輒以年計算。"},
      {t:"h3",html:"非都市土地用地變更六大流程步驟"},
      {t:"timeline",items:[
        {time:"步驟 1",title:"擬定開發計畫書",desc:"開發構想書、配置與量體初步構想"},
        {time:"步驟 2",title:"專案審查啟動",desc:"環評、水保計畫、生態檢核、文化資產勘查、交通衝擊評估"},
        {time:"步驟 3",title:"跨部會聯審",desc:"地方政府跨局處聯審、都市計畫委員會審議"},
        {time:"步驟 4",title:"公開展覽與說明會",desc:"民眾意見陳述、地方溝通"},
        {time:"步驟 5",title:"繳納回饋",desc:"開發回饋金、公共設施負擔或捐贈"},
        {time:"步驟 6",title:"編定異動",desc:"正式變更為合法建築用地"}
      ]},
      {t:"h3",html:"每一階段的實務重點與陷阱"},
      {t:"p",html:"<strong>擬定開發計畫書</strong>是成敗的起點，構想書品質決定審查順暢度，建議委託有經驗的顧問撰寫；<strong>專案審查</strong>階段最容易因環評、水保未過而卡關，須提前確認基地坡度與開發規模是否觸及門檻；<strong>跨部會聯審</strong>涉及多局處意見整合，常因單一單位有疑義而延宕；<strong>公開展覽與說明會</strong>是社會風險的主要來源，地方居民抗爭可能導致規模縮減；<strong>繳納回饋</strong>金額依開發強度與公共利益負擔計算，是常被低估的成本；最後<strong>編定異動</strong>完成後，土地才正式成為合法建築用地，可進入後續規劃報建。"},
      {t:"quote",html:"風險統計：非都市土地變更案，約 25～40% 會在審查階段被迫修正規模或遭駁回。務必將此不確定性納入投資決策，切勿以「一定過關」的心態孤注一擲。"},
      {t:"h3",html:"開發回饋金的計算邏輯"},
      {t:"p",html:"非都市土地變更往往必須負擔<strong>開發影響費或回饋金</strong>，其精神在於：開發行為增加公共設施與環境負擔，開發者應回饋社會。回饋內容可能是現金、捐贈公共設施用地，或自行興建公共設施。金額多寡依開發面積、強度、區位與地方規定計算，實務上常占開發成本的一至二成，是財務試算中不可忽略的重要項目。建議在變更前即與主管機關預先估算，避免事後超出預算。"},
      {t:"faq",items:[
        {q:"非都市土地變更需要多久？",a:"單純案約1.5～2.5年，大型或敏感區可達3～5年。是全開發流程中最耗時、不確定性最高的階段。"},
        {q:"非都市土地變更要經過哪些步驟？",a:"主要六步：擬定開發計畫書、專案審查（環評/水保/生態檢核）、跨部會聯審、公開展覽與說明會、繳納回饋金或公共設施、最後完成使用編定異動。"},
        {q:"什麼是開發回饋金？",a:"非都市土地開發者因增加公共設施與環境負擔，須以現金、捐贈公共設施用地或自行興建方式回饋社會。金額依開發面積、強度與區位計算，常占開發成本一至二成。"},
        {q:"非都市土地變更失敗機率高嗎？",a:"約25～40%的變更案會在審查階段被迫修正規模或遭駁回，風險偏高，投資決策時務必保留工期與資金緩衝。"}
      ]}
    ]}
  ]},
  {id:"p4",num:"第四篇",title:"規劃設計與建照申請",desc:"把土地變成可蓋房子的設計藍圖",chapters:[
    {id:"c8",title:"整體規劃與細部設計",blocks:[
      {t:"p",html:"當土地取得與用地變更完成後，開發案便進入「報建階段」——透過建築師的規劃設計，把土地變成一份可以送審、可以施工的完整設計藍圖。<strong>概念規劃工期約 21～45 天；全套細部施工圖 60～120 天（大樓複雜案可達 150 天）</strong>。這段時間看似冗長，實則決定整案的空間價值、法規合規性與施工可行性。"},
      {t:"h3",html:"8.1 概念規劃：從需求到空間雛形"},
      {t:"p",html:"概念規劃是設計的起點。建築師依基地條件、法規限制與市場需求，定義<strong>基地配置、建物量體、戶型、停車、綠化、公共設施動線</strong>等整體框架。這個階段的關鍵，是將「財務試算的可銷售坪數」與「基地的法規容積」整合成具體的建築方案。實務上，建築師會提出多個方案供開發商比較，例如不同樓高、不同戶型的組合，並逐一試算其可銷售價值與興建成本，找出「獲利最優」與「法規可行」的交集。"},
      {t:"h3",html:"預先諮詢（預審）：降低補正次數的關鍵"},
      {t:"p",html:"概念規劃階段最值得投資的一步，是<strong>與主管機關進行預先諮詢（預審）</strong>。開發商與建築師可先將初步構想送交建管單位，取得其對退縮、容積、停車、消防等主要疑慮的書面或會議意見。這項動作的價值極高：它能在正式送件前，就讓設計圖說符合主管機關的期待，大幅降低後續送件補正與退件的次數與時間。統計上，做過預審的案子，整體送審時程往往能縮短數週至數月。"},
      {t:"h3",html:"8.2 全套細部設計：把構想變成可施工圖說"},
      {t:"p",html:"概念定案後，建築師與各專業技師便展開全套細部施工圖設計。細部設計的產出必須完整涵蓋建築、結構、機電、消防、景觀各專業，才能支撐後續施工與勘驗。所有圖說皆須由對應專業技師簽證負責，任何疏漏都可能在勘驗或使照階段被退回。"},
      {t:"ul",items:["建築圖、結構圖、水電配置圖","消防系統圖、空調通風圖","雨污水排水圖、景觀設計圖","擋土及土方工程圖——所有圖說皆須技師簽證負責"]},
      {t:"h3",html:"設計階段的品質管控重點"},
      {t:"p",html:"設計品質直接決定後續施工與使照的順暢度。實務上，開發商應要求建築師建立<strong>內部審圖機制</strong>，在送件前由不同專業人員交叉檢查圖說完整性與一致性。常見的設計疏漏包括：停車位數量不足、避難動線與法規不符、結構計算書有誤、消防設備配置不當等。這些問題若能在設計階段被發現並修正，成本最低；若等到施工或使照階段才發現，往往要付出高昂的代價。"},
      {t:"faq",items:[
        {q:"整體規劃設計要花多少時間？",a:"概念規劃約21～45天，全套細部施工圖約60～120天，大樓等複雜案可達150天。"},
        {q:"什麼是建照預審（預先諮詢）？",a:"在正式送件前將初步構想送交建管單位諮詢，取得其對退縮、容積、停車、消防等疑慮的意見，可大幅降低後續補正與退件次數。"},
        {q:"細部設計包含哪些圖說？",a:"包含建築圖、結構圖、水電配置、消防系統、空調通風、雨污水排水、景觀設計與擋土土方圖，所有圖說皆須專業技師簽證。"},
        {q:"設計階段最常見的疏漏有哪些？",a:"停車位數不足、避難動線不符法規、結構計算書錯誤、消防設備配置不當等，建議建立內部審圖機制提早發現。"}
      ]}
    ]},
    {id:"c9",title:"各項專案審查與執照申請",blocks:[
      {t:"stats",items:[
        {stat:"21～45 天",lab:"消防/結構專審"},{stat:"30～90 天",lab:"建造執照審查"},
        {stat:"20～60 天",lab:"雜項執照"},{stat:"6 個月",lab:"建照後開工期限"}
      ]},
      {t:"p",html:"設計完成後，開發案便進入一連串的法定審查與執照申請程序。這階段的核心目標，是取得合法的<strong>建造執照（建照）</strong>與相關執照，讓土地得以合法動工。整體時程受審查補正次數影響，從數週到數月不等，是所有開發者都要面對的行政關卡。"},
      {t:"h3",html:"9.1 事前專審：送件前的各項專業審查"},
      {t:"p",html:"在正式送建照之前，開發商需先完成多項專業審查並取得合格文件，包括<strong>消防圖審、結構安全計算審查、污水處理計畫審查、交通影響審查</strong>等。這些專審由各專業主管機關或公會辦理，目的在確保設計符合消防、結構、環保、交通等專項法規。專審未通過前，建照送件往往不會被受理，因此必須預留審查時間。以消防圖審為例，複雜的集合住宅案常需反覆修正消防設備配置，是補正次數較高的項目之一。"},
      {t:"h3",html:"9.2 建造執照（建照）：合法施工的通行證"},
      {t:"p",html:"建造執照是建築物得以合法興建的法定許可。開發商向工務局建管處送件，經<strong>初審、複審、補正、核發</strong>的程序取得建照。建照內容載明起造人、承造人、監造人、建築概要、設計圖說等關鍵資訊。<strong>無建照施工屬違建，可勒令停工、拆除、罰鍰</strong>，因此務必等建照核發後才能動工。"},
      {t:"h3",html:"9.3 雜項執照：基礎工程的必要許可"},
      {t:"p",html:"地下室開挖、擋土牆、圍牆、土方整理等雜項工作物，須單獨申請<strong>雜項執照（雜照）</strong>。雜照核准後方可進行基礎工程。這項執照常被新手忽略，但實務上若基礎工程未取得雜照就先行施作，同樣構成違法施工，可能被勒令停工。因此，規劃時程時務必將雜照申請時間一併納入。"},
      {t:"h3",html:"9.4 開工備查：啟動施工前的法定登錄"},
      {t:"p",html:"建照核發後 <strong>6 個月內須完成開工備查</strong>，向主管機關登記承造人、監造人、工地負責人。逾期得申請展期；未展期則建照失效，需重新申請。開工備查是銜接「報建」與「施工」的關鍵程序，務必掌握時效，避免建照因逾期而失效，導致前功盡棄。"},
      {t:"quote",html:"常見建照卡關：退縮不足、停車位數不足、避難動線不符、結構計算書錯誤。"},
      {t:"h3",html:"審查送件的常見退件原因與補正策略"},{t:"p",html:"在實際送審經驗中，建造執照退件的原因高度集中在幾類：基地退縮與防火間隔不足、法定停車位數量不符、避難層與逃生動線設計不合規定、容積率與建蔽率計算錯誤，以及消防設備配置未達標準。開發商若能在設計階段即與建築師、技師共同進行「預審模擬」，將上述常見缺失先行排除，通常可把正式送審的退件次數從三次以上縮減到一次以內，大幅壓縮整體審查時程。此外，善用各縣市建管單位提供的法令研討會與預審機制，在正式掛件前先取得書面意見，是降低退件率、縮短開發期最有效的手段之一。審查通過取得執照後，仍應保留完整送審圖說與核准文件，作為日後開工勘驗、竣工查驗與產權登記的依據。"},{t:"faq",items:[
        {q:"建照審查要多久？",a:"建造執照審查約30～90天；消防、結構專審約21～45天；雜項執照約20～60天。實際時程依補正次數而異。"},
        {q:"沒有建照就施工會怎樣？",a:"無建照施工屬違建，可被勒令停工、拆除並處以罰鍰。務必等建照核發後才能動工。"},
        {q:"什麼是雜項執照？",a:"地下室開挖、擋土牆、圍牆、土方整理等雜項工作物須單獨申請的執照，雜照核准後才能進行基礎工程。"},
        {q:"建照核發後多久要開工？",a:"6個月內須完成開工備查並登記承造人、監造人、工地負責人；逾期得申請展期，未展期則建照失效。"}
      ]}
    ]}
  ]},
  {id:"p5",num:"第五篇",title:"工程施工與品質安全管控",desc:"把圖說變成實體建築",chapters:[
    {id:"c10",title:"標準施工流程",blocks:[
      {t:"p",html:"取得建照並完成開工備查後，開發案便進入最費時的施工階段。施工的核心任務，是依設計圖說把「紙上的建築」一步步變成「實體的建築」，並在過程中確保品質、安全與法規合規。<strong>以地上 10 層住宅大樓（含地下室 2 層）為例，總施工工期 18～28 個月</strong>，各工序必須循序推進，不可跳階。"},
      {t:"h3",html:"標準施工流程與工序時間軸"},
      {t:"timeline",items:[
        {time:"1～2 月",title:"整地工程",desc:"基地清理、放樣、土方挖填、整平"},
        {time:"2～4 月",title:"基礎前置",desc:"擋土工程、臨時排水、安全防護"},
        {time:"4～8 月",title:"基礎工程",desc:"開挖、基樁、基礎版、地下室結構"},
        {time:"8～18 月",title:"主體結構",desc:"地上樓層鋼筋、模板、混凝土、梁柱樓版"},
        {time:"14～22 月",title:"外部工程",desc:"外牆、門窗、防水、隔熱、屋頂"},
        {time:"16～24 月",title:"內部工程",desc:"隔間、地坪、天花板、室內裝修"},
        {time:"15～26 月",title:"機電設備",desc:"水電、消防、空調、電梯、弱電安裝測試"},
        {time:"20～28 月",title:"公共設施",desc:"道路、排水、綠化、景觀、停車場"}
      ]},
      {t:"h3",html:"為什麼施工工序不能跳階？"},
      {t:"p",html:"建築施工之所以嚴格要求工序循序推進，是因為<strong>每一道工序都是下一道工序的基礎</strong>。以基礎工程為例，若在擋土工程與安全防護未完成時就先行開挖，可能導致塌方與工安事故；若在地下室結構未完成時就進行主體結構，基礎承載力不足將危及整棟建築安全。因此，工程管理上特別強調「工序邏輯」——任何試圖縮短工期而跳階施工的作法，都可能埋下結構或安全隱患，得不償失。"},
      {t:"h3",html:"施工階段的進度與品質雙重管控"},
      {t:"p",html:"在漫長的施工期內，開發商與監造單位必須同時掌握「進度」與「品質」兩條線。進度管控上，建立工程進度表並定期召開工地會議，追蹤各工序的實際進度與落後原因；品質管控上，則透過材料進場檢驗、施工過程抽查、階段性勘驗等方式確保工程品質。特別要注意的是，<strong>工期若因趕工而壓縮，往往以犧牲品質為代價</strong>，因此成熟的開發商會在合約中預留合理工期，並以品質優先的態度管理承包商。"},
      {t:"h3",html:"施工階段的變更管理"},
      {t:"p",html:"施工過程中，因現場狀況、業主需求或法規調整，常會產生設計變更。變更管理的原則是：<strong>任何涉及結構、消防、防火區劃的變更，都必須事前送審核准後才能施工</strong>，絕不可私自變更。實務上，開發商應建立完整的變更管理流程，記錄每一次變更的原因、內容、成本與時程影響，避免因變更失控而導致工程延宕、成本超支，甚至在使照階段被查核為「現地與圖說不符」。"},
      {t:"h3",html:"開工前的整地、放樣與基礎工程"},{t:"p",html:"施工的第一個實質動作，是基地的整地、放樣與基礎工程。放樣工作決定建築物在基地上的精確位置，必須由專業測量人員依圖說將柱位、牆線、高程逐一標定，並與鄰地界址、道路中心線核對，避免日後產生越界或退縮不足的問題。基礎工程則依地質鑽探報告選擇適當形式：一般淺基礎如獨立基腳、連續基腳適用於承載力足夠的淺層地盤，深基礎如基樁、筏式基礎則用於軟弱地盤或高層建築。基礎施工完成後須進行充分養護與檢驗，確認混凝土強度達到設計值，方能進入主體結構的鋼筋綁紮與澆置階段，這是整棟建築安全最根本的環節，絕不可為了趕工而省略。"},{t:"faq",items:[
        {q:"一棟住宅大樓要蓋多久？",a:"以地上10層含地下室2層為例，總施工工期約18～28個月，視規模、複雜度與天候而異。"},
        {q:"施工工序可以跳階嗎？",a:"不可以。每一道工序都是下一道的基礎，跳階施工可能導致塌方、結構缺陷等嚴重問題，務必循序推進。"},
        {q:"施工期間如何管控品質？",a:"透過材料進場檢驗、施工抽查、階段性勘驗、工地會議等方式，同時掌握進度與品質，避免為趕工犧牲品質。"},
        {q:"施工中想變更設計怎麼辦？",a:"涉及結構、消防、防火區劃的變更必須事前送審核准後才能施工，並完整記錄變更內容，避免使照階段被認定現地與圖說不符。"}
      ]}
    ]},
    {id:"c11",title:"階段性勘驗與品質管控",blocks:[
      {t:"p",html:"施工品質的確保，除了依靠承包商的自律與監造的監督，更依賴法定的<strong>階段性勘驗</strong>制度。依照建築法規，施工過程中的關鍵階段，須由主管機關（或委託之專業機構）會同監造建築師、專業技師進行勘驗，確認工程與圖說一致。<strong>未勘驗合格不得繼續往上施工</strong>，這是確保建築品質的最後一道法定關卡。"},
      {t:"h3",html:"階段性勘驗的四大關鍵節點"},
      {t:"ul",items:["基礎勘驗","地下室結構勘驗","各樓層結構勘驗（大樓常抽查）","完工總勘驗"]},
      {t:"h3",html:"勘驗的執行方式與參與者"},
      {t:"p",html:"階段性勘驗由<strong>監造建築師、專業技師與主管機關</strong>共同查核簽證。監造建築師確認施工與圖說一致，結構技師確認鋼筋、混凝土等結構工程符合設計，消防、水保等專業技師則確認各系統施作正確。勘驗合格後簽證紀錄，作為後續使照申請的重要依據。這套制度的精神，在於把「品質把關」分散到施工的各個關鍵節點，而不是等到完工才一次檢查——因為到那時，許多隱蔽工程的缺失已難以修正。"},
      {t:"h3",html:"勘驗不合格的最常見原因與防範"},
      {t:"p",html:"實務統計上，<strong>勘驗不合格最常見原因：鋼筋配置與圖說不符、混凝土強度不足、防水層施作缺失</strong>。這三大問題都屬於「隱蔽工程」——一旦被下一道工序覆蓋，事後極難檢修。要防範這類問題，開發商與監造單位應要求承包商建立自主檢查機制，在勘驗前先完成內部檢查並留下紀錄；同時對鋼筋綁紮、混凝土澆置、防水施作等關鍵工項，採取「隨時抽查、即時改正」的高密度管理，確保勘驗一次通過，避免停工返工造成時程與金錢損失。"},
      {t:"quote",html:"勘驗不合格最常見原因：鋼筋配置與圖說不符、混凝土強度不足、防水層施作缺失。"},
      {t:"h3",html:"勘驗紀錄管理與數位化品質管控"},
      {t:"p",html:"階段性勘驗的成果，必須留下完整紀錄，才能作為使照申請與日後保固追蹤的依據。實務上，正規建案會建立<strong>勘驗紀錄簿與品質管理表單</strong>，逐次記載勘驗日期、勘驗項目、監造簽證與改善事項。近年來，越來越多的開發商導入<strong>數位化品質管理系統</strong>，透過行動裝置現場拍照、定位、簽證，將勘驗紀錄即時上傳雲端，讓監造單位、開發商與主管機關都能即時掌握品質狀態。數位化的好處在於資料可追溯、流程可稽核、缺失可追蹤，大幅降低人工作業的疏漏與爭議，也為整案留下完整的品質履歷。"},
      {t:"faq",items:[
        {q:"什麼是階段性勘驗？",a:"施工過程中由主管機關會同監造建築師、專業技師，在基礎、地下室、樓層結構與完工等關鍵節點進行的法定檢查，確認工程與圖說一致，未勘驗合格不得繼續施工。"},
        {q:"階段性勘驗有哪些節點？",a:"主要包括基礎勘驗、地下室結構勘驗、各樓層結構勘驗（大樓常抽查）與完工總勘驗。"},
        {q:"勘驗不合格最常見的原因有哪些？",a:"鋼筋配置與圖說不符、混凝土強度不足、防水層施作缺失等隱蔽工程問題，最易在勘驗階段被發現。"},
        {q:"如何避免勘驗不合格？",a:"要求承包商建立自主檢查機制、勘驗前完成內部檢查並留紀錄，對鋼筋、混凝土、防水等關鍵工項高密度抽查即時改正。"}
      ]}
    ]},
    {id:"c12",title:"工地安全與環衛管理",blocks:[
      {t:"p",html:"施工階段另一個不可輕忽的面向，是<strong>工地安全與環境衛生管理</strong>。依職業安全衛生法，營造工地須落實墜落防護、土方坍塌防護、機具管制、揚塵噪音管控與廢棄物清理等各項安全衛生措施。工安事故不僅造成人命傷亡，更會導致停工調查、工期延宕、鉅額賠償與商譽損失，是開發商與營造廠必須嚴肅面對的風險。"},
      {t:"h3",html:"工地安全五大防護重點"},
      {t:"ul",items:["墜落防護：安全網、護欄、安全帶，高處作業全面防護","土方坍塌防護：開挖面擋土、支撐、坡度管理","機具管制：吊掛作業、機械操作安全教育與檢查","揚塵噪音管控：灑水、防塵網、施工時段管理","廢棄物清理：分類、清運、營建廢棄物合法處理"]},
      {t:"h3",html:"高風險施工節點的特別管控"},
      {t:"quote",html:"工安事故風險最高的階段：<strong>基礎開挖與擋土施工</strong>，須列為重點管控節點。此階段發生塌方、墜落、地下管線損壞的機率最高，應設置專人監看、加密巡檢並嚴格執行安全作業程序。"},
      {t:"h3",html:"營建工地環衛與鄰里關係"},
      {t:"p",html:"除了內部安全，工地也須顧及<strong>周邊環境與鄰里關係</strong>。包括施工期間的粉塵、噪音、交通動線對鄰近居民的影響，都應透過灑水降塵、噪音管制時段、交通疏導等方式降到最低。許多成功的開發案，正是因為在施工期間與鄰里維持良好關係，後續銷售與交屋也更為順暢。反之，工安事故或環境污染一旦引爆鄰里抗議，輕則被檢舉停工，重則影響整案形象。"},
      {t:"h3",html:"安全教育與督導制度"},
      {t:"p",html:"工地安全不能只靠設備，更須靠制度與人員意識。正規工地會建立<strong>每日工具箱會議、定期安全教育、巡檢稽核與事故通報</strong>等機制，讓每位工人都了解作業風險與防護措施。同時，監造單位與開發商也應定期到場稽核，確認承包商確實落實各項安全措施，而非僅在形式上備妥文件。唯有把「安全第一」內化為工地文化，才能真正降低工安事故的發生機率。"},
      {t:"h3",html:"工安事故的應變與通報機制"},
      {t:"p",html:"即使防護完善，工安事故仍可能難以完全避免，因此<strong>事前應變計畫</strong>與<strong>事後通報機制</strong>同樣重要。依規定，發生重大工安事故，工地負責人須立即啟動應變措施（搶救、疏散、隔離），並依法向主管機關通報。正規工地會預先制定<strong>緊急應變計畫</strong>，包含急救器材配置、避難路線、通報窗口與媒體對應原則，並定期演練。同時，每一次事故（含未遂事件）都應進行<strong>事故調查與檢討</strong>，找出根本原因並修正作業程序，避免重蹈覆轍。唯有「防範於先、應變於中、檢討於後」三者並重，才能真正將工安風險降到最低。"},
      {t:"faq",items:[
        {q:"營建工地要遵守哪些安全法規？",a:"主要依職業安全衛生法及相關營造安全衛生設施標準，落實墜落防護、土方坍塌防護、機具管制、揚塵噪音管控與廢棄物清理等。"},
        {q:"工安風險最高的施工階段是什麼？",a:"基礎開挖與擋土施工階段風險最高，易發生塌方、墜落與地下管線損壞，須列為重點管控節點。"},
        {q:"工地如何減少對鄰里的影響？",a:"透過灑水降塵、噪音管制時段、交通疏導等方式降低粉塵、噪音與交通影響，並與鄰里維持良好關係。"},
        {q:"如何落實工地安全教育？",a:"建立每日工具箱會議、定期安全教育、巡檢稽核與事故通報機制，並由監造與開發商定期到場稽核落實度。"}
      ]}
    ]}
  ]},
  {id:"p6",num:"第六篇",title:"預售銷售與金融履約管理",desc:"與工程施工同步進行的資金回收",chapters:[
    {id:"c13",title:"預售作業規範",blocks:[
      {t:"p",html:"預售銷售是台灣住宅開發回收資金最重要的管道，也是開發商與消費者第一次大規模接觸的環節。工程達主管機關規定進度後，方可申請預售許可並合法對外銷售，<strong>預售許可申請約 15～45 天</strong>。預售制度讓開發商能在工程完成前先取得購屋資金，大幅減輕資金壓力；相對地，也要求開發商對消費者負擔更高的資訊揭露與契約誠信責任。"},
      {t:"h3",html:"預售許可與銷售前置作業"},
      {t:"p",html:"並非所有建案都可以預售。依規定，開發商須先取得建造執照並達到主管機關規定的工程進度，才能申請預售許可。申請通過後，才可正式對外銷售。在此之前，開發商通常已投入大量的<strong>市調、產品定位、廣告企劃與樣品屋製作</strong>等前置作業，確保建案開賣時能精準命中目標客群。預售期的資金回收效率，往往直接影響整案後續的工程資金調度。"},
      {t:"h3",html:"廣告與銷售行為的法定規範"},
      {t:"p",html:"預售銷售最大的法律風險，來自<strong>不實廣告</strong>。依消費者保護法與公平交易法，所有廣告、樣品屋、銷售文案皆須符合法定規範，不得不實宣傳、夸大坪數或隱瞞重要資訊。實務上常見的爭議包括：廣告平面圖與實際戶型不符、宣稱的公設比例與實際有落差、誇大建案周邊環境或未來願景。這些不實廣告一旦被認定，開發商不僅可能被罰鍰，還可能面對消費者解約、賠償與公平會處分。因此，正規開發商會建立廣告審查機制，確保所有對外說法都有實據。"},
      {t:"h3",html:"預售銷售的客群與市場節奏"},
      {t:"p",html:"一般住宅預售期約 6～18 個月，視市場行情與推案量能調整。市場熱絡時，優質建案可能開賣即完銷；市場冷清時，則需拉長銷售期並調整價格策略。成熟的開發商會密切觀察<strong>區域供需、房價走勢、利率環境與同業推案</strong>，動態調整銷售節奏。預售去化率是財務試算的核心假設之一，若銷售速度不如預期，將直接影響現金流入與利息成本，因此在推案前就應做好市場壓力測試。"},
      {t:"h3",html:"預售與工程進度的聯動管理"},
      {t:"p",html:"預售銷售與工程施工在時間上高度重疊，兩者的<strong>進度聯動</strong>是資金調度的關鍵。預售階段購屋人所繳納的各期款項，會依工程進度依序進帳；而工程款項的支付，也需要這筆資金支應。因此，開發商必須建立「銷售進度」與「工程進度」的雙軌管理，確保<strong>銷售回收的現金流，能即時支應工程支出的需求</strong>。若銷售不如預期，則需適度調整工程節奏或籌措融資；反之，若銷售超乎預期，也應避免過度擴張導致後續工程跟不上交屋承諾。唯有把兩條線精密對齊，才能在預售期間維持穩健的資金運作。"},
      {t:"faq",items:[
        {q:"建案什麼時候可以開始預售？",a:"須先取得建造執照並達到主管機關規定的工程進度，申請預售許可通過後才能合法對外銷售，許可申請約15～45天。"},
        {q:"預售廣告要注意哪些法律規範？",a:"依消保法與公平交易法，不得不實宣傳、夸大坪數或隱瞞重要資訊。廣告平面圖與實際戶型、公設比例差異是最常見爭議。"},
        {q:"一般住宅預售期多長？",a:"約6～18個月，視市場行情與推案量能調整，市場冷熱會直接影響銷售速度與資金回收。"},
        {q:"預售銷售有哪些前置作業？",a:"包括市場調查、產品定位、廣告企劃、樣品屋製作等，確保建案開賣能精準命中目標客群。"}
      ]}
    ]},
    {id:"c14",title:"契約與價金管理",blocks:[
      {t:"p",html:"預售交易的誠信，最終都落實在<strong>契約與價金管理</strong>上。開發商與購屋人簽訂法定預售屋定型化契約，明確坪數、價格、工期、交屋規範、違約責任等關鍵事項。這份契約不僅是交易的法律依據，更是保障雙方權益、避免日後糾紛的核心文件。"},
      {t:"h3",html:"預售屋定型化契約的核心內容"},
      {t:"p",html:"依內政部公告的「預售屋買賣定型化契約應記載及不得記載事項」，契約必須載明：<strong>房屋與土地面積、單價與總價、付款方式與期程、開工與完工期限、建材設備規格、交屋條件、違約金與解約條款</strong>等。同時，契約中不得記載開發商可片面變更坪數、任意延長工期、排除瑕疵擔保責任等不利消費者的條款。開發商若使用不符合規定的契約，消費者得主張該條款無效。"},
      {t:"h3",html:"價金信託與履約保證：保護購屋款項的機制"},
      {t:"quote",html:"依法須辦理<strong>價金信託或履約保證</strong>，購屋款項進入專戶，不得任由建商挪用。消費者爭議高發點：廣告平面圖與實際戶型差異、公設坪數爭議、交屋延期。"},
      {t:"p",html:"價金信託的運作邏輯是：購屋人依工程進度繳納的價金，存入由銀行或信託機構管理的專戶，由受託人依工程進度核撥給開發商。這樣一來，即使開發商財務出問題，消費者的購屋款項仍有保障，不會血本無歸。這是預售制度對消費者最重要的保護傘，也是開發商建立信譽的關鍵。開發商應確實依規辦理價金信託，並在銷售時向消費者清楚說明，以取得信任。"},
      {t:"h3",html:"契約與價金管理的實務重點"},
      {t:"p",html:"在管理層面，開發商應建立嚴謹的契約審查與價金帳務制度：<strong>契約簽訂前由法務逐條審核、價金入帳與核撥流程設有內控、工程進度與撥款時程緊密勾稽</strong>。同時，面對消費者的坪數、公設、工期疑慮，應以透明、誠實的態度溝通，減少資訊不對稱。因為預售屋的信任一旦建立，會轉化為口碑與再購意願；反之，一次契約爭議或價金挪用事件，就可能毀掉一間公司的長年商譽。"},
      {t:"h3",html:"客變與變更管理的價金影響"},
      {t:"p",html:"預售期間，購屋人常會提出<strong>客變</strong>需求——調整隔間、建材、配電等。客變是提升消費者滿意度的服務，但也可能影響價金與工期。正規開發商會建立明確的<strong>客變管理流程</strong>：設定客變申請與截止時限（通常在結構施工前）、提供標準化變更選項、明訂增減價金的計算方式，並將變更結果載入契約或補充協議。客變管理做得好，能讓消費者感到貼心；做得不好，則可能因追加費用、工期延誤或施工差異引發爭議。因此，客變的規則必須在銷售階段就清楚告知，讓消費者有所依循。"},
      {t:"faq",items:[
        {q:"預售屋契約必須包含哪些內容？",a:"依內政部定型化契約規定，須載明房屋土地面積、單價總價、付款方式、開工完工期限、建材設備、交屋條件、違約金與解約條款等。"},
        {q:"什麼是價金信託？",a:"購屋人依工程進度繳納的價金存入銀行或信託機構管理的專戶，由受託人依工程進度核撥，保障消費者即使開發商出問題也能保住購屋款。"},
        {q:"預售屋最常見的消費爭議有哪些？",a:"廣告平面圖與實際戶型差異、公設坪數爭議、交屋延期等，都是高發爭議點。"},
        {q:"開發商如何做好價金管理？",a:"建立契約逐條審核、價金入帳核撥內控、工程進度與撥款勾稽機制，並以透明誠實態度與消費者溝通。"}
      ]}
    ]},
    {id:"c15",title:"購屋貸款與銷售收尾",blocks:[
      {t:"p",html:"預售階段的尾聲，是協助購屋人完成<strong>銀行貸款申辦、對保與撥款</strong>，同時整理銷售資料與客戶檔案，為後續交屋作業鋪路。這階段雖然看似行政工作，卻直接影響購屋人能否順利取得貸款、以及建案能否如期收回款項。"},
      {t:"h3",html:"購屋貸款的流程與銀行對保"},
      {t:"p",html:"多數購屋人無法全額自備款購屋，須向銀行申請房屋貸款。開發商會配合合作銀行，協助購屋人完成<strong>貸款申請、估價、審核、對保與撥款</strong>等程序。對保是指購屋人與銀行確認貸款條件（額度、利率、期數）並簽署契約的過程。貸款成數依購屋人信用、房屋鑑價與政策而異，開發商應清楚告知購屋人貸款可能無法足額的風險，避免交屋時因資金不足而違約。"},
      {t:"h3",html:"工程期款與撥款時程的協調"},
      {t:"p",html:"預售屋的付款通常採「分期付款」方式，購屋人依工程進度繳納訂金、簽約金、開工款、各階段工程期款與交屋款。這些期款的收款時程，直接影響開發商的現金流規劃。實務上，開發商會與銀行協調<strong>分階段撥款</strong>機制，確保工程資金到位，同時也讓購屋人有所依循。價金信託專戶的核撥，則須與實際工程進度勾稽，保障雙方權益。"},
      {t:"h3",html:"銷售收尾與客戶關係管理"},
      {t:"p",html:"銷售尾聲，開發商應系統性地整理<strong>客戶檔案與銷售資料</strong>，包括每位購屋人的契約、付款紀錄、客變需求與聯絡資訊。這些資料是後續交屋、保固與售後服務的基礎。更重要的是，建立良好的客戶關係管理：主動告知工程進度、定期舉辦工地說明會、回應購屋人疑問。一個把客戶服務做到位的建案，往往能透過口碑帶來後續推薦，為開發商累積無形的品牌資產。"},
      {t:"h3",html:"交屋尾款與貸款不足的處理"},
      {t:"p",html:"交屋階段最常見的資金問題，是購屋人<strong>貸款成數不足</strong>。當銀行鑑價低於契約價格、或購屋人信用條件不佳導致貸款額度不足時，購屋人須以自備款補足差額。正規開發商會在銷售時就<strong>明確告知貸款風險</strong>，並在交屋前主動與購屋人確認貸款進度；若發生不足，則提供彈性的解決方案，例如協助與銀行協調、延長付款寬限、或依契約處理違約事宜。處理得宜，能避免交屋破局；處理不善，則可能演變成解約、退款與訴訟，耗費雙方大量時間成本。"},
      {t:"h3",html:"從銷售到交屋的無縫銜接"},
      {t:"p",html:"銷售團隊與交屋團隊的分工銜接，常是預售案最容易掉鏈子的環節。銷售階段承諾的內容（如建材品牌、公設項目），若未能完整交接給交屋團隊，就可能造成交屋時與消費者期待不符的落差。因此，正規開發商會建立<strong>銷售與交屋的資訊交接機制</strong>，將銷售承諾、客變紀錄、客戶備註完整移交，並在交屋前與消費者逐項確認。唯有讓購屋人感受到「從簽約到入住」的一致性與負責態度，整案的服務品質才算真正到位。"},
      {t:"faq",items:[
        {q:"購屋貸款的流程是什麼？",a:"包含貸款申請、銀行估價、審核、對保（確認額度利率期數並簽約）與撥款，開發商常配合合作銀行協助購屋人完成。"},
        {q:"什麼是對保？",a:"購屋人與銀行確認貸款條件（額度、利率、期數）並簽署貸款契約的過程，是貸款撥款前的重要程序。"},
        {q:"預售屋付款是怎麼進行的？",a:"採分期付款，依工程進度繳納訂金、簽約金、開工款、各階段工程期款與交屋款，並與價金信託專戶核撥勾稽。"},
        {q:"銷售收尾階段要做什麼？",a:"協助購屋人完成貸款申辦、對保與撥款，同時整理客戶檔案與銷售資料，並透過主動溝通做好客戶關係管理。"}
      ]}
    ]}
  ]},
  {id:"p7",num:"第七篇",title:"竣工驗收與使用執照",desc:"合法使用的唯一憑證",chapters:[
    {id:"c16",title:"工程竣工整體查驗",blocks:[
      {t:"p",html:"當施工階段的所有工程完工後，開發案便進入<strong>竣工查驗</strong>階段。這是一場「期末考」——所有過去幾年施工的成果，都要接受各專業技師與主管機關的全面檢驗，確認各系統正常運作、工程與圖說一致。<strong>內部竣工自查約 30～60 天</strong>，這是在正式送使照前，由開發商與承包商自行完成的總體檢。"},
      {t:"h3",html:"竣工自查的內容與流程"},
      {t:"p",html:"竣工自查的範圍涵蓋建築、結構、機電、消防、給排水、空調、電梯等所有工程項目。開發商會組織<strong>各專業技師逐一測試簽證</strong>，確認消防系統能正常警報與滅火、電梯能平穩運作、污水系統排放正常、電力供應穩定、空調通風符合設計。同時，也會對建築外觀、室內裝修、防水、門窗等作全面目視檢查，找出任何施作瑕疵。這項自查的價值在於：在正式送審前先發現並改正問題，避免在主管機關查驗時才被要求補正，浪費寶貴時間。"},
      {t:"h3",html:"竣工查驗的常見缺失與改正"},
      {t:"p",html:"實務上，竣工查驗最常發現的問題包括：<strong>消防設備未完成測試或功能異常、排水坡度不足導致積水、防水層滲漏、門窗安裝不正、機電系統接線錯誤</strong>等。這些問題若在竣工自查階段被發現並改正，成本相對可控；若等到使照查驗或交屋後才被發現，則可能導致使照延誤或消費者索賠。因此，正規開發商會建立<strong>竣工缺失清單與追蹤系統</strong>，逐項列管、限期改正、複查確認，確保所有缺失在交屋前徹底解決。"},
      {t:"h3",html:"竣工查驗與使照申請的銜接"},
      {t:"p",html:"竣工自查完成、所有缺失改正後，開發商才能正式向主管機關申請使用執照。竣工自查的完整性，直接決定使照申請的順暢度——<strong>自查做得越扎實，正式查驗的補正次數越少，使照核發越快</strong>。因此，成熟的開發商不會把竣工當作施工的結束，而是視為另一場嚴謹的品質把關作業，投入與施工同等的重視。"},
      {t:"h3",html:"竣工查驗的清單化管理"},
      {t:"p",html:"要把竣工查驗做得徹底，關鍵在於<strong>清單化管理</strong>。開發商與監造單位會預先建立一份完整的<strong>竣工查驗清單</strong>，逐層、逐戶、逐系統列出所有檢查項目——從每一層的消防栓、每一戶的門窗開關，到屋頂的防水與排水，都以逐項打勾的方式確認。查驗過程發現的任何問題，都登錄到缺失清單並編號追蹤，限期改正、複查銷案。這種「清單式、編號化、可追蹤」的管理方式，能確保沒有任何角落被遺漏，也為日後的保固與交屋留下完整的品質紀錄，避免事後爭議各說各話。"},
      {t:"faq",items:[
        {q:"什麼是竣工自查？",a:"施工全數完工後，由開發商組織各專業技師逐一測試簽證、全面檢查所有工程項目的總體檢，內部自查約30～60天。"},
        {q:"竣工查驗要檢查哪些項目？",a:"涵蓋消防、電梯、污水、電力、空調、給排水等系統測試，以及建築外觀、室內裝修、防水、門窗等目視檢查。"},
        {q:"竣工查驗最常發現哪些問題？",a:"消防設備未完成測試、排水坡度不足積水、防水滲漏、門窗安裝不正、機電接線錯誤等。"},
        {q:"竣工自查為何重要？",a:"在正式送使照前先發現並改正缺失，可大幅減少正式查驗的補正次數，加速使照核發。"}
      ]}
    ]},
    {id:"c17",title:"使用執照（使照）申請",blocks:[
      {t:"p",html:"使用執照（使照）是建築物得以<strong>合法使用</strong>的唯一憑證。<strong>使照審查約 45～120 天</strong>，建管單位現場勘查，核對圖說與現地一致性、法規符合性。沒有使照，建築物就不能合法入住、使用、登記或交易——它是整個開發流程中「合法化」的終極關卡。"},
      {t:"h3",html:"什麼是使用執照？為什麼如此重要？"},
      {t:"quote",html:"<strong>無使照之建物，不得辦理建物第一次登記、不得交屋、不得合法使用。</strong>常見使照卡關：消防設備測試不合格、公共設施未完成、現地與圖說不符。"},
      {t:"p",html:"使用執照是由主管機關核發，證明建築物已依核准圖說施工完成、並符合相關法規、可合法使用的文件。它同時是<strong>建物第一次登記、辦理貸款、申請水電、合法營業</strong>的前置條件。對消費者而言，使照代表這棟房子「合法、安全、可安心居住」；對開發商而言，使照是交屋與回收尾款的必要門檻。因此，使照申請是開發商必須嚴陣以待的最後一場行政攻防。"},
      {t:"h3",html:"使照審查的程序與重點"},
      {t:"p",html:"使照審查主要分為書面審查與現場勘查兩部分。書面審查確認各項文件與技師簽證完備；<strong>現場勘查</strong>則由建管單位人員到場，核對建築物現地與核准圖說是否一致、是否符合建築技術規則與消防等相關法規。審查重點包括：建築物量體與退縮是否符合、消防設備是否依圖設置且功能正常、公共設施是否完成、停車空間是否依規施作等。任何一項不符，都可能被要求補正，延長審查時程。"},
      {t:"h3",html:"如何避免使照卡關？"},
      {t:"p",html:"使照卡關最常見的原因，是<strong>現地與圖說不符</strong>。這往往源於施工階段私自變更設計而未送審，導致竣工的建築與建照圖說不一致。要避免這種情況，關鍵在於施工階段的嚴格管理：任何變更都必須事前送審，竣工自查時逐一比對圖說與現地。此外，<strong>消防設備測試、公共設施完成度</strong>也是高風險項目，應在送件前確保完備。唯有把細節做足，才能在使照審查中一次過關，順利交屋。"},
      {t:"h3",html:"使照取得後的行政銜接"},
      {t:"p",html:"使照核發並非流程的終點，而是後續一連串行政作業的起點。取得使照後，開發商須儘速辦理<strong>建物第一次登記</strong>（委託地政士測量、登記）、申辦<strong>水電與瓦斯送電</strong>、並依約辦理<strong>交屋</strong>。同時，使照內容也是後續分户移轉、房屋稅籍設立與買賣過戶的依據。實務上，使照核發後到交屋的這段銜接期，正是檢驗開發商行政效率的時刻——銜接順暢，購屋人便能早日入住；銜接遲滯，則可能因拖延而引發交屋延期的爭議。因此，成熟的開發商會在送照的同時就平行準備登記與交屋的前置文件，讓流程無縫接軌。"},
      {t:"faq",items:[
        {q:"什麼是使用執照？",a:"使用執照（使照）是主管機關核發、證明建築物已依核准圖說施工完成並符合法規、可合法使用的文件，是建物登記、交屋與合法使用的唯一憑證。"},
        {q:"使照審查要多久？",a:"約45～120天，含書面審查與現場勘查，實際時程依補正次數而異。"},
        {q:"沒有使照會怎樣？",a:"無使照之建物不得辦理建物第一次登記、不得交屋、不得合法使用，也無法申辦貸款與水電。"},
        {q:"如何避免使照卡關？",a:"確保施工階段所有變更事前送審、竣工時逐一比對圖說與現地，並在送件前完成消防測試與公共設施。"}
      ]}
    ]}
  ]},
  {id:"p8",num:"第八篇",title:"產權登記、交屋與保固",desc:"完成交付的最終一哩路",chapters:[
    {id:"c18",title:"建物第一次登記",blocks:[
      {t:"p",html:"取得使照後，開發案便進入產權的「合法化」程序——<strong>建物第一次登記</strong>。取得使照後，委託地政士辦理建物測量、成果核驗、第一次登記，將建物產權登記於起造人（建設公司）名下，完成建物合法產權初始建立。<strong>工期約 30～75 天</strong>。這是建築物從「實體存在」走向「法律存在」的關鍵一步。"},
      {t:"h3",html:"什麼是建物第一次登記？為什麼必要？"},
      {t:"p",html:"建物第一次登記（又稱建物所有權第一次登記），是指新建完成的建築物，依法向地政事務所申請辦理所有權登記的程序。在此之前，建物在土地登記簿上並無產權紀錄，無法進行買賣、設定抵押或辦理貸款。<strong>只有完成第一次登記，建物才取得法律上的產權身分</strong>，也才能進一步移轉給購屋人。因此，它是交屋與產權交易鏈上不可或缺的起點。"},
      {t:"h3",html:"第一次登記的程序與文件"},
      {t:"p",html:"辦理建物第一次登記，通常委託<strong>地政士（代書）</strong>辦理。程序大致包括：先辦理<strong>建物測量</strong>，由地政事務所派員實地測量建物位置、面積與結構；接著申請<strong>成果核驗</strong>，確認測量成果與使用執照相符；最後辦理<strong>第一次登記</strong>，將建物登記於起造人名下。所需文件包括使用執照、建物測量成果圖、所有權人身分證明等。過程中有任何圖說與現地不符之處，都可能被要求補正，因此務必確保測量與使照內容一致。"},
      {t:"h3",html:"第一次登記的實務注意事項"},
      {t:"p",html:"第一次登記的品質，直接影響後續分户移轉的順暢度。實務上應注意：<strong>測量面積與契約面積是否一致</strong>（若因公設計算產生差異，須妥善說明）、<strong>共有部分（公設）的登記方式</strong>是否依規定辦理、以及<strong>登記時效</strong>——使照取得後應儘速辦理，避免拖延影響交屋。地政士的專業度在此階段至關重要，一個熟練的代書能協助開發商避開許多登記上的地雷。"},
      {t:"h3",html:"公設（共有部分）登記的細節"},
      {t:"p",html:"住宅大樓的產權登記，除了專有部分（各戶室內），還包含<strong>共有部分</strong>——即梯廳、走廊、機電空間、停車空間等公共設施。這些共有部分的登記與持分比例，直接影響每戶的公設比與房價計算，也是交屋時消費者最容易產生疑慮的環節。實務上，開發商須依<strong>建物測量成果與登記規定</strong>，將共有部分正確分配並登記於各戶名下。若公設比例與銷售時宣稱不符，極易引發消費爭議。因此，在第一次登記階段就應依契約與銷售資料仔細核對公設計算，確保「說的」與「登的」一致。"},
      {t:"faq",items:[
        {q:"什麼是建物第一次登記？",a:"新建完成建築物依法向地政事務所申請辦理所有權登記的程序。只有完成第一次登記，建物才取得法律產權，才能進行買賣、貸款與移轉。"},
        {q:"建物第一次登記要多久？",a:"約30～75天，含建物測量、成果核驗與登記，實際時程依補正而異。"},
        {q:"第一次登記包含哪些程序？",a:"先辦理建物測量（實地測量位置面積結構），再申請成果核驗（與使照核對），最後辦理第一次登記於起造人名下。"},
        {q:"第一次登記要注意什麼？",a:"確保測量面積與契約面積一致、依規辦理共有部分（公設）登記，並於取得使照後儘速辦理以利交屋。"}
      ]}
    ]},
    {id:"c19",title:"分户移轉與交屋流程",blocks:[
      {t:"p",html:"完成建物第一次登記後，開發商便依預售契約逐戶辦理<strong>產權移轉</strong>至購屋人，同時進行<strong>驗屋、缺失整改、設備點交、鑰匙交付、稅費結算</strong>等交屋作業。<strong>分户移轉每批次約 15～45 天</strong>。交屋是開發商與消費者之間最直接的服務接觸點，也是口碑與糾紛的分水嶺。"},
      {t:"h3",html:"分户移轉的程序與順序"},
      {t:"p",html:"分户移轉是指將建物第一次登記於起造人名下的產權，依買賣契約逐戶移轉給各購屋人。程序上通常由地政士統一辦理，依<strong>契約、款項結清、稅費申報</strong>等條件成熟度分批送件。移轉完成後，購屋人正式成為建物的所有權人。分户移轉的順暢度，取決於契約是否逐戶核對正確、價金是否結清、以及相關稅費（如契稅、登記規費）是否申報完備。"},
      {t:"h3",html:"驗屋與缺失整改：交屋的品質把關"},
      {t:"p",html:"交屋前，購屋人通常會進行<strong>驗屋</strong>，檢查房屋品質是否符合契約與圖說。開發商應準備完整的<strong>標準驗屋清單</strong>，並建立<strong>缺失追蹤系統</strong>，逐一記錄購屋人發現的缺失、限期整改、複查確認後才交屋。常見的交屋缺失包括：防水滲漏、牆面裂縫、地坪不平、設備功能異常。實務上，驗屋品質與處理態度，直接決定購屋人對建案與品牌的評價——處理得好，消費者滿意甚至願意推薦；處理不好，則可能演變成解約或訴訟。"},
      {t:"quote",html:"交屋爭議最高發：防水滲漏、牆面裂縫、地坪不平、設備功能異常。"},
      {t:"h3",html:"設備點交、鑰匙交付與稅費結算"},
      {t:"p",html:"驗屋通過、缺失整改完成後，進入最後的<strong>設備點交與鑰匙交付</strong>。開發商會陪同購屋人逐項點交衛浴、廚具、門窗、水電開關等設備，確認功能正常並交付保固書、使用說明等文件，最後交付鑰匙。同時辦理<strong>稅費結算</strong>，包括房屋稅、地價稅的按日分攤，以及水電瓦斯費的過戶。整個交屋流程若能井然有序、透明清楚，購屋人才能安心入住，開發商也能順利完成整案的交付。"},
      {t:"h3",html:"交屋時程與驗屋程序的標準化"},
      {t:"p",html:"大型建案的交屋動輒數十戶至上百戶，若無標準化流程，極易陷入混亂與延誤。成熟的開發商會制定<strong>交屋時程表與驗屋SOP</strong>：依工程完工順序與客戶意願排定交屋梯次，每梯次安排專人陪同驗屋、逐項填寫驗屋單、即時記錄缺失並排定整改。同時，針對高峰期（如農曆年前）提前部署交屋人力與物資。標準化的好處在於：消費者能被清楚告知流程與等待時間，開發商則能有效調度資源、控制交屋節奏。一次井然有序的交屋，往往是建案口碑的最高潮，也是開發商與消費者建立長期信任的最佳契機。"},
      {t:"faq",items:[
        {q:"什麼是分户移轉？",a:"將建物第一次登記於起造人名下的產權，依買賣契約逐戶移轉給各購屋人的程序，每批次約15～45天。"},
        {q:"交屋前為什麼要驗屋？",a:"驗屋讓購屋人確認房屋品質符合契約與圖說，開發商據此建立缺失清單、限期整改、複查後交屋。"},
        {q:"交屋最常見的爭議有哪些？",a:"防水滲漏、牆面裂縫、地坪不平、設備功能異常等，是交屋階段最高發的爭議點。"},
        {q:"交屋包含哪些程序？",a:"產權移轉、驗屋、缺失整改、設備點交、鑰匙交付與稅費結算（房屋稅、地價稅、水電瓦斯過戶）。"}
      ]}
    ]},
    {id:"c20",title:"保固與後續維護",blocks:[
      {t:"p",html:"交屋不是開發服務的結束，而是<strong>保固與售後服務</strong>的開始。依建築法規，建商針對不同項目提供法定保固年限，並在保固期間內免費維修改善。良好的保固服務，是開發商建立品牌信譽、創造口碑推薦的關鍵機會。"},
      {t:"h3",html:"法定保固年限一覽"},
      {t:"table",head:["項目","法定保固年限"],widths:["50%","50%"],rows:[
        ["建物結構","15 年"],["防水工程","5 年"],["機電設備","1 年"],["一般裝修","1 年"]
      ]},
      {t:"h3",html:"保固服務的運作機制"},
      {t:"p",html:"保固期間內，購屋人若發現屬保固範圍的瑕疵，可向開發商申請維修，開發商應免費處理。實務上，正規建商會建立<strong>保固服務窗口與追蹤系統</strong>，受理購屋人報修、派工維修、追蹤完成並確認滿意。保固服務的品質，往往是消費者衡量一間建商「負不負責」的最直接標準。做好保固服務，不僅能降低訴訟風險，更能將一次性的買賣關係轉化為長期的客戶信任。"},
      {t:"h3",html:"社區公共設施移交與長期維護"},
      {t:"p",html:"除了房屋本體的保固，開發商還須處理<strong>社區公共設施的移交</strong>。公共設施（道路、排水、綠化、景觀、停車場、公共空間等）完成後，應移交給管理委員會或物業公司接管維護。移交時應提供完整的設施清冊、設備說明、保固資訊與管理建議，確保社區能在開發商離場後自主運作。同時，開發商在保固期內仍須對公共設施的保固範圍負責，與管委會建立良好的協作關係。"},
      {t:"h3",html:"從交屋到永續服務的思維轉變"},
      {t:"p",html:"成熟的開發商，會把交屋與保固視為<strong>品牌經營</strong>而非單純的契約履行。交屋後主動關懷、快速處理保固問題、定期回訪社區，都能累積口碑，為下一個建案帶來潛在客戶。反觀若交屋後消失無蹤、推諉保固責任，則可能因負評與訴訟而損害品牌形象。因此，把售後服務做好，其實是最划算的長期投資。"},
      {t:"h3",html:"保固期間的常見維修與爭議處理"},
      {t:"p",html:"保固期間內最常接到報修的項目，不外乎<strong>防水滲漏、磁磚膨拱、門窗異音、衛浴排水不順</strong>等。這些問題多屬材料或施作瑕疵，開發商應以「快速回應、誠意處理」的態度面對，而非推諉卸責。實務上，正規開發商會備妥<strong>維修團隊或委外保修廠商</strong>，並建立報修與維修完成的標準時限，例如緊急滲漏於24小時內處理。對於是否屬保固範圍的爭議，則依契約與工程紀錄判斷，必要時委由第三方專業鑑定。保固期內的服務品質，往往決定開發商在消費者心中的長期評價，值得投入資源經營。"},
      {t:"faq",items:[
        {q:"建物的法定保固年限是多久？",a:"依建築法規，建物結構15年、防水工程5年、機電設備1年、一般裝修1年。保固期間內屬保固範圍的瑕疵免費維修。"},
        {q:"保固期間如何申請維修？",a:"購屋人可向開發商的保固服務窗口報修，開發商應免費派工處理並追蹤完成，正規建商會建立保固追蹤系統。"},
        {q:"公共設施要如何移交？",a:"道路、排水、綠化、停車場等公共設施完成後移交給管理委員會或物業公司，並提供設施清冊、設備說明與管理建議。"},
        {q:"為什麼做好保固服務很重要？",a:"保固服務是消費者衡量建商責任感的最直接標準，做好能累積口碑、降低訴訟風險、轉化長期客戶信任。"}
      ]}
    ]}
  ]},
  {id:"p9",num:"第九篇",title:"開發成本、稅務與財務",desc:"決定獲利與資金安全的底線",chapters:[
    {id:"c21",title:"完整開發成本結構",blocks:[
      {t:"p",html:"土地開發的獲利，來自「總銷金額」與「總開發成本」之間的價差。因此，精準掌握每一項成本，是決定整案能否獲利的關鍵。以下為各成本項目占<strong>「總銷金額」</strong>的參考比例（都會區住宅案為例），可作為投資試算的基礎。"},
      {t:"table",head:["成本項目","占總銷金額"],widths:["55%","45%"],rows:[
        ["土地成本","25～40%（都會區偏高）"],["建安工程費","40～55%"],
        ["設計、技師、監造費","3～6%"],["管銷、廣告、銷售佣金","4～8%"],
        ["回饋金、公共設施負擔","0～10%（非都市土地重）"],["利息與財務成本","6～12%"],
        ["各項稅金、規費、保險、雜項","3～7%"]
      ]},
      {t:"p",html:"※ 各區域、案件類型差異大，本表僅供投資試算參考。"},
      {t:"h3",html:"成本結構的解讀：為什麼土地與工程是兩大主體？"},
      {t:"p",html:"從上表可以看出，<strong>土地成本與建安工程費合計往往占總銷金額的七成以上</strong>，是開發成本的兩大主體。土地成本在都會區占比尤其高，反映的是地段價值的稀缺性；建安工程費則涵蓋結構、水電、裝修、外牆等所有施工費用，直接與樓高、建材等級、設計複雜度相關。這兩項成本一旦失控，其他成本再省也無法挽救獲利。因此，開發商在尋地與發包階段就必須精準控制這兩大主體。"},
      {t:"h3",html:"最容易低估的「隱形成本」"},
      {t:"p",html:"除了土地與工程兩大主體，實務上最常被低估的是<strong>利息、管銷與稅金</strong>三項隱形成本。<strong>利息成本</strong>與開發週期高度相關——工期每延長一年，累積利息就可能增加數百萬至上千萬元；<strong>管銷成本</strong>在房市冷清時會因銷售期拉長而上升；<strong>稅金</strong>則涵蓋營業稅、土地增值稅、房屋稅、營所稅等，規畫不當可能侵蝕可觀利潤。這三項成本看似比例不高，卻常常是「壓垮獲利的最後一根稻草」。"},
      {t:"h3",html:"成本控制的三大原則"},
      {t:"p",html:"成熟的開發商會以三大原則控制成本：<strong>第一，前期精算</strong>——在決策前把所有成本項目列入試算，不留模糊地帶；<strong>第二，過程管控</strong>——透過預算編列、採購控管、變更管理，避免成本在施工過程中失控；<strong>第三，現金流管理</strong>——透過分階段撥款、銷售進度與利息成本的滾動檢討，確保資金運用效率。成本控制不是單純「省錢」，而是讓每一分投入都產生最大的開發價值。"},
      {t:"faq",items:[
        {q:"土地開發成本主要包含哪些項目？",a:"包含土地成本（25～40%）、建安工程費（40～55%）、設計技師監造費（3～6%）、管銷廣告（4～8%）、回饋金（0～10%）、利息財務成本（6～12%）與稅金雜項（3～7%）。"},
        {q:"哪兩項成本占開發總成本最大？",a:"土地成本與建安工程費合計往往占總銷金額七成以上，是開發成本的兩大主體，也是最須精準控制的項目。"},
        {q:"最容易被低估的成本有哪些？",a:"利息、管銷與稅金三項隱形成本最常被低估，尤其利息與開發週期高度相關，工期延長會顯著放大。"},
        {q:"如何有效控制開發成本？",a:"掌握前期精算、過程管控、現金流管理三大原則，把所有成本列入試算並滾動檢討。"}
      ]}
    ]},
    {id:"c22",title:"核心稅務規範",blocks:[
      {t:"p",html:"土地開發涉及多種稅負，稅務規劃的良窳，直接影響整案的淨獲利。開發前期即委託會計師進行<strong>合約架構階段的稅務規劃</strong>，往往能透過合法的安排節省可觀稅負；反之，若等到銷售或移轉階段才思考稅務，調整空間往往已非常有限。"},
      {t:"ul",items:[
        "<strong>土地增值稅</strong>：土地移轉時課徵；合建、都更有減免機制",
        "<strong>契稅</strong>：建物移轉時課徵",
        "<strong>營業稅</strong>：預售銷售、建物移轉",
        "<strong>營利事業所得稅</strong>：開發案獲利",
        "<strong>房屋稅</strong>：建物登記後每年課徵"
      ]},
      {t:"h3",html:"各核心稅種的課徵邏輯與節稅方向"},
      {t:"p",html:"<strong>土地增值稅</strong>針對土地移轉時的地價上漲利益課徵，是土地交易最大宗稅負之一，實務上合建分屋與都市更新享有一定減免機制，應善加利用。<strong>契稅</strong>在建物移轉時課徵，稅率依買賣、贈與等不同原因而異。<strong>營業稅</strong>適用於預售銷售與建物移轉的加值額。<strong>營利事業所得稅</strong>則就開發案最終獲利課徵。<strong>房屋稅</strong>在建物登記後每年課徵，稅率依房屋用途（住家用、營業用）而異。每一種稅的課徵時點與計算基準都不同，開發商須全面掌握。"},
      {t:"h3",html:"房地合一稅對土地開發的影響"},
      {t:"p",html:"自房地合一稅（所得稅法規定之房屋、土地交易所得稅）實施以來，不動產交易的稅務結構產生重大變化。房地合一稅針對房屋及土地的交易所得課徵，持有期間越短稅率越高，並設有自住、重購退稅等優惠。對土地開發而言，<strong>持有期間與銷售策略</strong>直接影響稅負高低，因此從持有、興建到出售的時程規畫，都應將房地合一稅納入考量。"},
      {t:"h3",html:"稅務規劃的原則：事前、合法、專業"},
      {t:"quote",html:"稅務規劃建議：開發前期即委託會計師，於合約架構階段規劃，後期調整空間有限。"},
      {t:"p",html:"稅務規劃的核心原則是<strong>「事前、合法、專業」</strong>。事前——在合約架構與投資架構確立前就規劃，才有調整空間；合法——透過稅法允許的優惠與安排節稅，而非逃漏稅；專業——委託會計師或稅務顧問，依個案設計最適架構。房地產開發的稅務複雜度高，自行摸索往往漏失節稅機會或誤觸法規紅線，專業顧問的投入是CP值最高的成本之一。"},
      {t:"h3",html:"稅務合規與申報時程管理"},
      {t:"p",html:"除了節稅規劃，<strong>稅務合規</strong>同樣不可輕忽。土地開發涉及營業稅、營所稅、土地增值稅、房屋稅等多種稅捐，各有其課徵時點與申報義務。一旦漏報、逾期或錯誤申報，輕則補稅加罰，重則影響產權移轉與交屋時程。因此，正規開發商會建立<strong>稅務行事曆</strong>，將各稅種的申報與繳納時點納入管理，並定期與會計師核對帳務。尤其土地增值稅與房地合一稅涉及移轉時點的安排，更須與買賣、登記時程精準配合。稅務管理做得好，不只省稅，更能避免因合規問題而打亂整案的資金與時程節奏。"},
      {t:"faq",items:[
        {q:"土地開發涉及哪些主要稅種？",a:"土地增值稅（土地移轉）、契稅（建物移轉）、營業稅（預售銷售）、營利事業所得稅（開發獲利）與房屋稅（登記後每年課徵）。"},
        {q:"什麼是房地合一稅？",a:"針對房屋及土地交易所得課徵的稅，持有期間越短稅率越高，設有自住與重購退稅等優惠，對開發的持有與銷售時程規畫有直接影響。"},
        {q:"合建與都更有何稅務優惠？",a:"合建分屋與都市更新在土地增值稅等稅負上享有一定減免機制，應善加利用以降低稅負。"},
        {q:"稅務規劃的最佳時機是什麼？",a:"開發前期、合約架構確立前是最佳時機，建議委託會計師規劃，後期調整空間有限。"}
      ]}
    ]}
  ]},
  {id:"p10",num:"第十篇",title:"風險管控與實務案例",desc:"降低失敗率的最後防線",chapters:[
    {id:"c23",title:"全流程風險總整理",blocks:[
      {t:"p",html:"土地開發是一場「與風險共舞」的長期賽局。從尋地、盡調、用地變更、報建、施工、銷售到交屋，每一個階段都存在可能讓整案受損甚至失敗的風險。掌握<strong>全流程風險矩陣</strong>，並針對高風險項目建立預防方案，是降低失敗率的最後防線。"},
      {t:"table",head:["風險項目","發生機率","影響等級","預防方案"],widths:["28%","16%","16%","40%"],rows:[
        ["土地權屬/共有爭議","中","高","完整 DD、所有權人全數簽署"],
        ["主管機關審查延宕","高","中","提前預審、保留工期緩衝"],
        ["法規更新變動","低","高","保留法規風險緩衝條款"],
        ["工程品質缺失","中","中","監造落實、階段勘驗、材料抽驗"],
        ["工安事故","低","極高","安衛定期查核、開挖重點管控"],
        ["房市下行、銷售延滯","中","高","壓力測試、保留現金緩衝"],
        ["資金斷鏈、利息超支","中","極高","分階段撥款、現金流滾動管理"]
      ]},
      {t:"h3",html:"風險矩陣的解讀：從機率與影響找出優先順序"},
      {t:"p",html:"風險管理的第一步，是依「發生機率」與「影響等級」兩個維度，找出最需優先控管的風險。從上表可看出，<strong>資金斷鏈、工安事故</strong>雖發生機率不高，但影響等級極高，一旦發生足以致命；而<strong>主管機關審查延宕、房市下行</strong>則發生機率高，會持續侵蝕利潤與時程。實務上，開發商應同時管理「高機率」與「高影響」兩類風險，不可顧此失彼。"},
      {t:"h3",html:"分階段風險管控的重點"},
      {t:"p",html:"不同開發階段的風險重點不同：<strong>前期（尋地盡調）</strong>最怕買到權屬瑕疵或不可開發的土地，須以完整DD把關；<strong>規劃報建階段</strong>最怕審查延宕，須以預審與工期緩衝因應；<strong>施工階段</strong>最怕工安與品質問題，須以監造與勘驗管控；<strong>銷售階段</strong>最怕房市下行，須以壓力測試與現金緩衝防範；<strong>交屋階段</strong>最怕消費爭議，須以完善驗屋與售後服務化解。唯有全流程、分階段地佈防，才能將整體失敗率降到最低。"},
      {t:"h3",html:"風險文化的建立"},
      {t:"p",html:"最高層次的風險管理，是建立<strong>風險文化</strong>——讓「風險意識」內化為團隊每個決策的預設思維。這包括：決策前主動評估風險、重大事項設定停損點、保留法規與市場變動的緩衝、以及定期檢討風險控管成效。具備風險文化的開發商，即使在市場下行時也能穩健存活；反之，只追求獲利而忽視風險的開發商，往往在景氣反轉時首當其衝。"},
      {t:"h3",html:"風險緩衝與停損機制的建立"},
      {t:"p",html:"實務上，成熟的開發商會為整案預留多層<strong>風險緩衝</strong>：在財務上，保留一定的現金緩衝與融資額度，避免資金鏈因銷售延滯而斷裂；在時程上，為各階段審查預留緩衝工期，避免單一環節延誤拖垮全案；在法規上，保留對法規變動的因應彈性，例如契約中設定不可抗力與法規變更的處理條款。同時，針對重大投資決策設定明確的<strong>停損點</strong>——當 IRR 跌破門檻、成本超支達一定比例或關鍵風險失控時，果斷暫停或終止，而非陷入「沉沒成本謬誤」越陷越深。這些機制看似保守，卻是在漫長開發週期中保護資本的最重要設計。"},
      {t:"faq",items:[
        {q:"土地開發最大的風險是什麼？",a:"資金斷鏈與工安事故雖機率不高但影響極高，土地權屬爭議與審查延宕則機率高，都是須優先控管的風險。"},
        {q:"如何管理土地開發風險？",a:"依發生機率與影響等級建立風險矩陣，分階段佈防（DD、預審、監造勘驗、壓力測試、售後服務），並建立風險文化。"},
        {q:"審查延宕如何防範？",a:"透過提前預審、保留工期緩衝、避免送件補正等方式降低審查延宕的機率與影響。"},
        {q:"房市下行時如何因應？",a:"透過壓力測試評估最壞情境、保留現金緩衝、調整銷售節奏與價格策略等方式防範。"}
      ]}
    ]},
    {id:"c24",title:"產業常見缺失與糾正機制",blocks:[
      {t:"p",html:"土地開發產業在實務運作中，存在一些反覆出現的缺失。認識這些<strong>常見缺失</strong>及其<strong>糾正機制</strong>，能幫助開發商避開前人踩過的坑，讓流程更順暢、風險更低。"},
      {t:"ol",items:[
        "<strong>送件大量補正</strong>：圖說品質不足、未預審 → 建築師內部審圖、主管機關預先諮詢",
        "<strong>勘驗不合格</strong>：監造未落實 → 階段性自主檢查表",
        "<strong>使照卡關</strong>：現地與圖說不符 → 施工變更須事前送審，禁止私自變更",
        "<strong>交屋爭議</strong>：驗屋整改機制不足 → 標準驗屋清單、缺失追蹤系統"
      ]},
      {t:"h3",html:"缺失一：送件大量補正"},
      {t:"p",html:"這是報建階段最常見的痛點。圖說品質不足、未與主管機關預審，導致送件後反覆補正、退件，拖長整體時程。糾正機制有兩道：<strong>第一道是建築師內部審圖</strong>，在送件前由不同專業交叉檢查圖說完整性；<strong>第二道是主管機關預先諮詢（預審）</strong>，在正式送件前先確認主要疑慮。兩者並行，能將補正次數降到最低。"},
      {t:"h3",html:"缺失二：勘驗不合格"},
      {t:"p",html:"勘驗不合格往往源於監造未落實、承包商自主檢查不足。糾正機制是建立<strong>階段性自主檢查表</strong>，要求承包商在勘驗前先逐項自我檢查並留下紀錄，監造單位再複查。透過「自主檢查＋監造複查」的雙重把關，能大幅提高勘驗一次通過的機率，避免停工返工的時程與金錢損失。"},
      {t:"h3",html:"缺失三：使照卡關"},
      {t:"p",html:"使照卡關最常見原因是<strong>現地與圖說不符</strong>，源於施工階段私自變更設計而未送審。糾正機制是明確規範<strong>施工變更須事前送審</strong>，任何涉及結構、消防、防火區劃的變更都必須核准後才能施工，嚴禁私自變更。同時，竣工自查時逐一比對圖說與現地，確保一致。"},
      {t:"h3",html:"缺失四：交屋爭議"},
      {t:"p",html:"交屋爭議源於驗屋與缺失整改機制不足，導致購屋人發現瑕疵無處申訴或處理緩慢。糾正機制是建立<strong>標準驗屋清單</strong>與<strong>缺失追蹤系統</strong>，將驗屋流程標準化、缺失處理透明化，逐項列管、限期整改、複查確認。完善的交屋機制，是避免消費爭議與訴訟的最有效防線。"},
      {t:"h3",html:"持續改善與內部稽核機制"},
      {t:"p",html:"上述四大缺失的糾正，若能進一步升級為<strong>持續改善機制</strong>，效果將更為長遠。成熟的開發商會在每個案子結束後進行<strong>案後檢討</strong>，將送審補正、勘驗缺失、使照卡關、交屋爭議等問題彙整成知識庫，並回饋到標準作業程序（SOP）與教育訓練中。同時，建立<strong>內部稽核機制</strong>，定期抽查各專案的流程執行是否落實，及早發現偏離並矯正。唯有把每一次的錯誤轉化為組織能力，讓「不二過」成為團隊的默契，開發商才能在持續競爭的市場中逐步累積難以複製的專業優勢。"},
      {t:"faq",items:[
        {q:"土地開發最常犯的錯誤有哪些？",a:"送件大量補正、勘驗不合格、使照卡關、交屋爭議等四大常見缺失，各有對應的糾正機制。"},
        {q:"如何減少送件補正次數？",a:"透過建築師內部審圖與主管機關預先諮詢（預審）雙管齊下，在送件前確保圖說品質與主管機關期待一致。"},
        {q:"如何避免勘驗不合格？",a:"建立階段性自主檢查表，要求承包商勘驗前自我檢查並留紀錄，監造再複查，提高一次通過機率。"},
        {q:"如何避免交屋爭議？",a:"建立標準驗屋清單與缺失追蹤系統，將驗屋標準化、缺失處理透明化，逐項列管、限期整改、複查確認。"}
      ]}
    ]},
    {id:"c25",title:"經典實務案例解析",blocks:[
      {t:"p",html:"理論再多，不如真實案例有說服力。以下三個經典實務案例，涵蓋都市合建、非都市農地變更與都市更新三種主流開發模式，從中可看到<strong>時程、成本、風險與策略</strong>如何相互交織，也是開發者最好的學習教材。"},
      {t:"cards",items:[
        {h:"案例一：都市合建住宅",p:"10 層住宅/2 地下室，地主出地建商出資。總時程 2 年 10 個月，IRR 14.2%。關鍵風險：地主家族意見分歧延遲點交，以分階段付款化解。"},
        {h:"案例二：非都市農地變更",p:"小型休閒住宅，坡度約 8%。總時程 4 年 8 個月，用地變更佔 2 年 3 個月。回饋水保佔成本 8.2%；因居民抗爭調降量體，IRR 由 16.1% 降至 12.3%。"},
        {h:"案例三：都市更新案",p:"老舊公寓街區重建。整合 3 年 4 個月、施工 26 個月、全案約 6 年。關鍵難點：少數住戶不同意，透過都更強制機制完成；容積獎勵為獲利核心。"}
      ]},
      {t:"h3",html:"案例一解析：都市合建住宅的溝通智慧"},
      {t:"p",html:"這個案例的啟發，在於<strong>合建案的成敗關鍵往往不在工程，而在「人」</strong>。地主家族對分配比例與時程各有意見，一度延遲點交土地。建商透過<strong>分階段付款</strong>與持續溝通，將地主的疑慮轉化為信任，最終順利推進，IRR 達 14.2% 超越門檻。這說明了合建案中，契約設計（分階段付款）與關係經營（持續溝通）的重要性，不下於土地本身的價值。"},
      {t:"h3",html:"案例二解析：非都市開發的量體調降智慧"},
      {t:"p",html:"這個案例點出非都市土地開發的兩大風險：<strong>審查耗時與居民抗爭</strong>。用地變更佔了整整 2 年 3 個月，回饋水保成本高達 8.2%。更關鍵的是，因居民抗爭，開發商被迫調降量體，IRR 由 16.1% 降至 12.3%，險些跌破門檻。這個案例的教訓是：<strong>非都市開發務必預留充分的時程與量體緩衝，並及早進行地方溝通</strong>，否則再好的規劃也可能因抗爭而縮水。"},
      {t:"h3",html:"案例三解析：都市更新的耐力賽"},
      {t:"p",html:"都市更新是典型的「耐力賽」，整合階段就花了 3 年 4 個月，全案長達 6 年。案例中最難的是<strong>少數住戶不同意</strong>，最終透過都市更新的強制機制完成。都市更新的獲利核心，在於<strong>容積獎勵</strong>所帶來的額外可銷售面積。這個案例提醒開發者：都更案的前期整合成本與時間極高，但若能善用容積獎勵並完成住戶整合，報酬也相對豐厚，是適合有耐心與資源的開發商投入的模式。"},
      {t:"h3",html:"三個案例的共通啟示與可複製心法"},{t:"p",html:"綜觀上述三個案例，可以歸納出幾項可複製的開發心法。第一，溝通先於施工：無論合建、非都市開發或都市更新，把地主、居民與地方政府當作合作夥伴而非障礙，提早進行透明而誠懇的溝通，往往能省下數倍於溝通的審查與協調成本。第二，風險預判重於事後補救：在尋地階段就把坡度、地質、容積、環評與水土保持門檻全部查核完畢，避免投入鉅額規劃費用後才發現計畫不可行。第三，耐心是最大的資本：土地開發是動輒三到七年的長週期事業，財務規劃必須預留足夠的時間與資金緩衝，才能在審查延宕、景氣波動時依然穩健推進。這三點心法，正是所有成功開發案背後共同的底層邏輯，值得每一位從業者內化為日常決策的基本準則。"},{t:"faq",items:[
        {q:"合建案成功的關鍵是什麼？",a:"關鍵常在「人」而非工程，透過分階段付款與持續溝通化解地主意見分歧，是合建案順利推進的核心。"},
        {q:"非都市開發最需要注意什麼？",a:"審查耗時與居民抗爭是兩大風險，務必預留充分時程與量體緩衝，並及早進行地方溝通。"},
        {q:"都市更新的獲利來源是什麼？",a:"核心在容積獎勵所帶來的額外可銷售面積，但前期住戶整合耗時長、難度高，適合有耐心與資源的開發商。"},
        {q:"從這三個案例學到什麼？",a:"開發成功=精準時程+成本控制+風險管理+人際溝通，不同開發模式有不同風險與策略，應依自身資源選擇。"}
      ]}
    ]}
  ]
  }]};
</script>
<script>
/* ============ 渲染邏輯 ============ */
const main=document.getElementById('main'),toc=document.getElementById('toc');
const esc=s=>String(s);

/* 扁平化章節索引 */
let flatArr=[];
for(let pi=0;pi<BOOK.parts.length;pi++){
  const p=BOOK.parts[pi];
  for(let ci=0;ci<p.chapters.length;ci++){
    flatArr.push({part:p,ch:p.chapters[ci],pi,ci});
  }
}

/* 區塊渲染器 */
function renderBlocks(blocks){
  return blocks.map(b=>{
    switch(b.t){
      case 'h3':return `<h3 class="sec">${b.html}</h3>`;
      case 'p':return `<p>${b.html}</p>`;
      case 'quote':return `<blockquote>${b.html}</blockquote>`;
      case 'ul':return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
      case 'ol':return `<ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
      case 'stats':return `<div class="grid g4">${b.items.map(s=>`<div class="card"><div class="stat">${s.stat}</div><div class="lab">${s.lab}</div></div>`).join('')}</div>`;
      case 'cards':return `<div class="grid g3">${b.items.map(c=>`<div class="card"><h4>${c.h}</h4><p style="font-size:13px;color:var(--muted);margin:0;line-height:1.6">${c.p}</p></div>`).join('')}</div>`;
      case 'timeline':return `<div class="timeline">${b.items.map(t=>`
        <div class="tl-item"><div class="tl-time">${t.time}</div>
        <div class="tl-axis"><div class="tl-dot"></div><div class="tl-line"></div></div>
        <div class="tl-body"><h4>${t.title}</h4><p>${t.desc}</p></div></div>`).join('')}</div>`;
      case 'table':{
        let cols=b.widths.map(w=>`<col style="width:${w}">`).join('');
        let head=b.head.map(h=>`<th>${h}</th>`).join('');
        let rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
        return `<div class="tbl-wrap"><table><colgroup>${cols}</colgroup><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      case 'faq':return `<div class="faq"><div class="faq-title">常見問答（FAQ）</div>${b.items.map(f=>`
        <details class="faq-item"><summary><span class="q">${f.q}</span><span class="ico">＋</span></summary><p>${f.a}</p></details>`).join('')}</div>`;
      default:return '';
    }
  }).join('');
}

/* 麵包屑 */
function crumb(items){return `<nav class="crumb">${items.map((it,i)=>`${i?'<span class="sep">/</span>':''}${it.href?`<a href="${it.href}" data-nav>${it.t}</a>`:`<b>${it.t}</b>`}`).join('')}</nav>`;}

/* 首頁 */
function renderHome(){
  const stats=`
  <div class="grid g4" style="margin-bottom:30px">

/* 篇首頁 */
function renderPart(p){
  const idx=flatArr.findIndex(f=>f.part.id===p.id);
  const chs=p.chapters.map((c,i)=>{
    const fi=idx+i;
    const firstP=c.blocks.find(b=>b.t==='p');
    const snippet=firstP?cleanHtml(firstP.html).slice(0,40)+'…':'';
    return `<div class="part-card" data-goto="#/chap/${c.id}">
      <div class="pnum">${String(i+1).padStart(2,'0')}</div>
      <h4>${c.title}</h4><p>${snippet}</p></div>`;
  }).join('');
  const list=p.chapters.map(c=>{
    const fp=c.blocks.find(b=>b.t==='p');
    return `<li><strong>${c.title}</strong>：${fp?cleanHtml(fp.html).slice(0,84):''}</li>`;
  }).join('');
  return `
  <article class="prose" style="max-width:960px">
  ${crumb([{t:"首頁",href:"#/"},{t:p.num},{t:p.title}])}
  <div class="part-hero"><div class="kicker">${p.num}</div><h2>${p.title}</h2><p>${p.desc}。本篇共 ${p.chapters.length} 個章節，依開發流程循序展開，適合建設公司、營造廠、建築師、技師、地政人員、開發投資人與相關科系師生研讀。</p></div>
  <h2 class="chap"><span class="cn">CHAPTERS</span>本篇章節導覽</h2>
  <div class="part-grid">${chs}</div>
  <h2 class="chap"><span class="cn">SUMMARY</span>本篇重點一覽</h2>
  <ul>${list}</ul>
  </article>`;
}

/* 章節頁 */
function renderChap(f){
  const idx=flatArr.indexOf(f);
  const prev=flatArr[idx-1],next=flatArr[idx+1];
  const pager=`
  <div class="pager">
    ${prev?`<a data-goto="#/chap/${prev.ch.id}"><div class="dir">← 上一章</div><div class="ttl">${prev.ch.title}</div></a>`:'<span></span>'}
    ${next?`<a class="next" data-goto="#/chap/${next.ch.id}"><div class="dir">下一章 →</div><div class="ttl">${next.ch.title}</div></a>`:'<span></span>'}
  </div>`;
  return `
  <article class="prose">
  ${crumb([{t:"首頁",href:"#/"},{t:f.part.title,href:`#/part/${f.part.id}`},{t:f.ch.title}])}
  <h2 class="chap" style="border:none;margin-top:0"><span class="cn">${f.part.num}</span>${f.ch.title}</h2>
  ${renderBlocks(f.ch.blocks)}
  ${pager}
  </article>`;
}

/* 搜尋 */
function renderSearch(q){
  const hits=[];
  flatArr.forEach(f=>{
    f.ch.blocks.forEach(b=>{
      let txt='';
      if(b.t==='p'||b.t==='quote')txt=b.html;
      else if(b.items)txt=b.items.join(' ');
      else if(b.rows)txt=b.rows.map(r=>r.join(' ')).join(' ');
      if(txt.toLowerCase().includes(q.toLowerCase())){
        hits.push({f,txt});
      }
    });
  });
  const list=hits.slice(0,30).map(h=>`
    <div class="search-hit" data-goto="#/chap/${h.f.ch.id}">
      <div class="h">${h.f.part.num}・${h.f.ch.title}</div>
      <div class="m">${h.txt.replace(/<[^>]+>/g,'').slice(0,90)}…</div>
    </div>`).join('');
  return `<article class="prose" style="max-width:960px">${crumb([{t:"首頁",href:"#/"},{t:`搜尋：${q}`}])}
  <h2 class="chap" style="border:none"><span class="cn">SEARCH</span>找到 ${hits.length} 處結果</h2>${list||'<p style="color:var(--muted)">查無符合結果，試試其他關鍵字。</p>'}</article>`;
}

/* TOC 側欄 */
function renderTOC(activeId){
  let html=`<button class="toc-item" data-goto="#/" style="font-weight:600">總覽・全書地圖</button>`;
  BOOK.parts.forEach((p,pi)=>{
    html+=`<div class="toc-part"><span class="num">${String(pi+1).padStart(2,'0')}</span>${p.title}</div><div class="toc-sub">`;
    p.chapters.forEach(c=>{
      html+=`<button class="toc-item ${activeId===c.id?'active':''}" data-goto="#/chap/${c.id}">${c.title}</button>`;
    });
    html+=`</div>`;
  });
  toc.innerHTML=html;
}

/* ============ SEO / AEO / GEO 優化 ============ */
const SITE_NAME="建築業土地開發全流程百科全書";
const PAGE_URL=()=>location.origin+location.pathname;
function cleanHtml(s){return (s||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();}
function chapterText(f){let t=[];f.ch.blocks.forEach(b=>{if(b.t==='p'||b.t==='quote'||b.t==='h3')t.push(cleanHtml(b.html));else if(b.items&&Array.isArray(b.items)&&typeof b.items[0]==='string')t.push(b.items.map(i=>cleanHtml(i)).join(' '));else if(b.rows)t.push(b.rows.map(r=>r.join(' ')).join(' '));});return t.join(' ');}
function chapterFaqs(f){let faqs=[];f.ch.blocks.forEach(b=>{if(b.t==='faq')b.items.forEach(x=>faqs.push({q:cleanHtml(x.q),a:cleanHtml(x.a)}));});return faqs;}

function setSEO(title,desc,type,extra){
  document.title=title;
  const md=document.querySelector('meta[name="description"]');if(md)md.setAttribute('content',desc.slice(0,160));
  const kw=document.querySelector('meta[name="keywords"]');if(kw)kw.setAttribute('content',"土地開發,營建,建築,容積率,建蔽率,土地使用分區,建造執照,使用執照,都市更新,危老重建,非都市土地,用地變更,盡職調查,合建,預售屋,房地合一稅,土地開發流程");
  const can=document.querySelector('link[rel="canonical"]');if(can)can.setAttribute('href',PAGE_URL());
  const ogt=document.querySelector('meta[property="og:title"]');if(ogt)ogt.setAttribute('content',title);
  const ogd=document.querySelector('meta[property="og:description"]');if(ogd)ogd.setAttribute('content',desc.slice(0,160));
  const old=document.getElementById('seo-jsonld');if(old)old.remove();
  const el=document.createElement('script');el.type='application/ld+json';el.id='seo-jsonld';
  if(type==='chapter'){
    const faqs=(extra&&extra.faqs)||[];
    const ld=[
      {"@context":"https://schema.org","@type":"Article","headline":title,"description":desc.slice(0,160),"inLanguage":"zh-Hant","mainEntityOfPage":PAGE_URL(),"publisher":{"@type":"Organization","name":SITE_NAME},"author":{"@type":"Person","name":"土地開發百科編輯群"}},
      {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
        {"@type":"ListItem","position":1,"name":"首頁","item":PAGE_URL()},
        {"@type":"ListItem","position":2,"name":extra.partTitle,"item":PAGE_URL()+"#/part/"+extra.partId},
        {"@type":"ListItem","position":3,"name":title,"item":PAGE_URL()+"#/chap/"+extra.chapId}]}
    ];
    if(faqs.length){ld.push({"@context":"https://schema.org","@type":"FAQPage","mainEntity":faqs.map(f=>({"@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))});}
    el.textContent=JSON.stringify(ld);
  }else if(type==='part'){
    el.textContent=JSON.stringify({"@context":"https://schema.org","@type":"CollectionPage","name":title,"description":desc.slice(0,160),"inLanguage":"zh-Hant","mainEntityOfPage":PAGE_URL()+"#/part/"+extra.id});
  }else{
    el.textContent=JSON.stringify({"@context":"https://schema.org","@type":"WebPage","name":title,"description":desc.slice(0,160),"inLanguage":"zh-Hant","mainEntityOfPage":PAGE_URL()});
  }
  document.head.appendChild(el);
}

/* 路由 */
function route(){
  const h=location.hash||'#/';
  let m;
  if((m=h.match(/#\/part\/(p\d+)/))){
    const p=BOOK.parts.find(x=>x.id===m[1]);
    renderTOC(p.id); main.innerHTML=renderPart(p);
    setSEO(`${p.num}・${p.title}｜${SITE_NAME}`, `${p.title}：${p.desc}。本篇涵蓋 ${p.chapters.map(c=>c.title).join('、')} 等${p.chapters.length}個章節，深入解析台灣土地開發的關鍵程序與決策要點。`, 'part', {id:p.id});
  }else if((m=h.match(/#\/chap\/(c\d+)/))){
    const f=flatArr.find(x=>x.ch.id===m[1]);
    renderTOC(f.ch.id); main.innerHTML=renderChap(f);
    setSEO(`${f.part.num}・${f.ch.title}｜${SITE_NAME}`, chapterText(f).slice(0,160), 'chapter', {faqs:chapterFaqs(f),partTitle:f.part.title,partId:f.part.id,chapId:f.ch.id});
  }else if((m=h.match(/#\/search\/(.+)/))){
    const q=decodeURIComponent(m[1]);
    renderTOC(''); main.innerHTML=renderSearch(q);
    setSEO(`搜尋「${q}」｜${SITE_NAME}`, `「${q}」在${SITE_NAME}的全文搜尋結果，涵蓋容積率、建蔽率、建照、使照、都更等章節。`, 'search');
  }else{
    renderTOC(''); main.innerHTML=renderHome();
    setSEO(SITE_NAME+'｜台灣土地開發・用地變更・建照使照・都更合建權威指南', "台灣營建產業土地開發全階段權威指南：從尋地、盡職調查、用地變更、報建、施工、預售、使用執照到交屋保固的完整標準化作業手冊，涵蓋容積率、都市更新、房地合一稅等關鍵議題。", 'home');
  }
  main.scrollTop=0;window.scrollTo(0,0);
  if(location.hash==='#articles'){var _ar=document.getElementById('articles');if(_ar){setTimeout(()=>_ar.scrollIntoView({behavior:'smooth',block:'start'}),80);}}
  document.getElementById('toc').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
window.addEventListener('hashchange',route);

/* 事件委派（data-goto / data-nav） */
document.body.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto],[data-nav]');
  if(g){location.hash=g.getAttribute('data-goto')||g.getAttribute('data-nav');}
});
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');document.getElementById('scrim').classList.add('show');};
document.getElementById('scrim').onclick=()=>{toc.classList.remove('open');document.getElementById('scrim').classList.remove('show');};

/* 搜尋輸入 */
let st;
document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(st);
  st=setTimeout(()=>{
    const q=e.target.value.trim();
    location.hash=q?`#/search/${encodeURIComponent(q)}`:'#/';
  },250);
});

route();
</script>

<script>
/* 浮動 Dropdown Menu 控制台 */
(function(){
  var fab=document.getElementById('fddFab'),panel=document.getElementById('fddPanel');
  fab.addEventListener('click',function(){fab.classList.toggle('open');panel.classList.toggle('open');});
  document.addEventListener('click',function(e){if(!document.getElementById('fdd').contains(e.target)){fab.classList.remove('open');panel.classList.remove('open');}});
  window.fddTheme=function(){document.getElementById('themeBtn').click();};
  window.fddBackTop=function(){window.scrollTo({top:0,behavior:'smooth'});};
  window.fddSearch=function(){var i=document.getElementById('searchInput');if(i){i.focus();i.select();}};
  window.fddPrint=function(){window.print();};
  window.fddFull=function(){if(document.fullscreenElement){document.exitFullscreen();}else{document.documentElement.requestFullscreen();}};
  window.fddRandom=function(){var a=document.querySelectorAll('#fddNav a');if(a.length){a[Math.floor(Math.random()*a.length)].click();}};
  /* 站內導覽：從既有 TOC 收集 */
  function buildNav(){
    var nav=document.getElementById('fddNav');nav.innerHTML='';
    var links=document.querySelectorAll('aside.toc a[data-nav], a[data-nav]');
    var seen={};links.forEach(function(a){
      var href=a.getAttribute('href');var t=(a.textContent||'').trim().replace(/\s+/g,' ');
      if(!href||seen[href])return;seen[href]=1;
      var li=document.createElement('li'),x=document.createElement('a');
      x.href=href;x.textContent=t.length>34?t.slice(0,34)+'…':t;
      x.setAttribute('data-nav','');li.appendChild(x);nav.appendChild(li);
    });
    if(!nav.children.length){nav.innerHTML='<li><a href="#/">📖 瀏覽全書</a></li>';}
  }
  buildNav();
  /* Breadcrumb：更新目前章節 */
  function syncCrumb(){
    var crumb=document.getElementById('fddCrumb');
    var active=document.querySelector('.content [data-nav].active, aside.toc a.active, .content a.active');

  }
  window.addEventListener('hashchange',function(){setTimeout(buildNav,50);setTimeout(syncCrumb,120);});
  setTimeout(syncCrumb,200);
})();
</script>
