.cat-tab[data-cat=zi].active{background:var(--zi);color:#fff;border-color:var(--zi)}
.cat-tab[data-cat=zheng].active{background:var(--zheng);color:#fff;border-color:var(--zheng)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:10px 18px 20px}
.zcard{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;transition:.15s}

.zcard .zt{padding:11px 13px;font-weight:700;font-size:14px;display:flex;align-items:flex-start;gap:8px;cursor:pointer}

.zcard[data-cat=zheng] .dot{background:var(--zheng)} .zcard[data-cat=dush] .dot{background:var(--dush)}
.zcard .zt .chev{margin-left:auto;color:var(--gold2);font-size:15px;transition:.2s}
.zcard.no-proj .zt{cursor:default}
.zcard.open .chev{transform:rotate(180deg)}
.proj-body{display:none;border-top:1px dashed var(--line);padding:10px 13px;background:#fcfbf7;font-size:12.5px}
.zcard.open .proj-body{display:block}
.proj-item{padding:7px 0;border-bottom:1px dashed var(--line)}

.proj-item .pn{font-weight:700;color:var(--ink);font-size:13px}
.proj-item .pm{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.proj-empty{color:var(--muted);font-style:italic}

.empty-county{padding:30px 18px;text-align:center;color:var(--muted)}
footer{padding:26px 0 40px;color:var(--muted);font-size:12.5px;text-align:center}
footer a{color:var(--gold2)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.cat-tab{font-size:12px}}

  }).join('');
