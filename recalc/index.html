      "acceptedAnswer": {
        "@type": "Answer",

<script>
/* 全域錯誤捕捉：顯示在畫面上方便除錯 */
window.__errLog = [];
window.addEventListener('error', function (e) {
  window.__errLog.push(e.message + ' @ ' + (e.filename || '').split('\\').pop() + ':' + e.lineno);
  var d = document.getElementById('__debugBar');
  if (!d) {
    d = document.createElement('div');
    d.id = '__debugBar';
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#c24141;color:#fff;font-size:12px;padding:6px 14px;z-index:99999;max-height:120px;overflow:auto;font-family:monospace';
    document.body.appendChild(d);
  }
  d.innerHTML = '<b>JS 錯誤：</b>' + window.__errLog.join('<br>');
});
window.addEventListener('DOMContentLoaded', function () {
  /* 等待所有 deferred 腳本就緒後再初始化下拉選單 */
  var dd = document.getElementById('catDD');
  if (!dd || dd.__cat) return;
  var btn = document.getElementById('catDDbtn');
  var menu = document.getElementById('catDDmenu');
  function close() { dd.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (dd.classList.contains('open')) { close(); }
    else { dd.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
  });
  document.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  /* 嘗試填入分類選單（可能已由 app.js 處理，這裡是備援） */
  function populateMenu() {
    var CATS = window.RECalcCategories || [];
    if (menu && CATS.length && !menu.children.length) {
      var head = document.createElement('div');
      head.className = 'dd-head'; head.textContent = '工具分類';
      menu.appendChild(head);
      CATS.forEach(function (c) {
        var a = document.createElement('a');
        a.className = 'dd-item'; a.href = '#/cat/' + c.id; a.setAttribute('role', 'menuitem');
        a.innerHTML = '<svg class="dd-ic" viewBox="0 0 24 24"><use href="#i-' + c.icon + '"></use></svg><span>' + c.name + '</span>';
        menu.appendChild(a);
      });
      menu.addEventListener('click', close);
    }
  }
  populateMenu();
  /* 再等 300ms 重試一次（defer 腳本可能還在載入） */
  setTimeout(populateMenu, 300);
  setTimeout(populateMenu, 1000);

  dd.__cat = true;
});
</script>
