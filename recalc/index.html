<script>
(function(){var nav=document.getElementById('floatingNav');if(!nav)return;
var dirs=location.pathname.split('/').filter(Boolean);
if(dirs.length&&dirs[dirs.length-1].indexOf('.')>=0)dirs.pop();
var base=dirs.map(function(){return '../';}).join('');
nav.querySelectorAll('a[data-t]').forEach(function(a){a.setAttribute('href',base+a.getAttribute('data-t'));});
var t=document.getElementById('fnToggle');
t.addEventListener('click',function(){nav.classList.toggle('open');});
document.addEventListener('click',function(e){if(!nav.contains(e.target))nav.classList.remove('open');});
})();
</script>
